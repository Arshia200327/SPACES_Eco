#D5DAE6\"><span style=\"color: #7FB0FF; font-weight: 600\">What I’d measure · <\u002Fspan>{{ chainCur.measure }}<\u002Fdiv>\n<sc-if value=\"{{ chainCur.hasTool }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size: 14px; line-height: 1.6; color: #D5DAE6\"><span style=\"color: #5BD6A0; font-weight: 600\">Tool I’d use · <\u002Fspan>{{ chainCur.tool }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"border-radius: 22px; border: 1px solid {{ shockCur.bd }}; background: {{ shockCur.bg }}; padding: 26px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF8A93\">SHOCK PATH<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 600\">{{ shockCur.name }}<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #AEB6CA\">{{ shockCur.story }}<\u002Fdiv>\n<sc-if value=\"{{ shockCur.active }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size: 14px; line-height: 1.6; color: #D5DAE6; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08)\"><span style=\"color: #7FB0FF; font-weight: 600\">How I’d quantify it · <\u002Fspan>{{ shockCur.method }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 RISK -->\n<section id=\"risk\" class=\"slide\" style=\"background: #0B1022\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">08 · Risk analysis<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">Eight risks, mapped, and how each one moves.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">A first, qualitative map from public information. Each risk comes with the model that would replace my judgement with a measured estimate from SPACES’ data, and a mitigation. Switch views to see where the mitigations move them.<\u002Fp>\n\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Risk view\" style=\"display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14)\">\n<button class=\"tab\" sc-camel-on-click=\"{{ setRiskNow }}\" aria-pressed=\"{{ riskView.nowPressed }}\" style=\"border: none; background: {{ riskView.nowBg }}; color: {{ riskView.nowFg }}\">Today<\u002Fbutton>\n<button class=\"tab\" sc-camel-on-click=\"{{ setRiskMit }}\" aria-pressed=\"{{ riskView.mitPressed }}\" style=\"border: none; background: {{ riskView.mitBg }}; color: {{ riskView.mitFg }}\">With mitigation<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"risk-grid\">\n<div style=\"display: flex; gap: 14px\">\n<div style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8B94AB; text-align: center\">IMPACT →<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 10px\">\n<div class=\"rmatrix\">\n<div style=\"position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{ riskCells }}\" as=\"c\" hint-placeholder-count=\"9\"><div style=\"border-radius: 12px; background: {{ c.bg }}\"><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<sc-for list=\"{{ riskDots }}\" as=\"d\" hint-placeholder-count=\"8\">\n<button class=\"rdot\" sc-camel-on-click=\"{{ d.pick }}\" aria-label=\"{{ d.aria }}\" style=\"left: {{ d.left }}%; top: {{ d.top }}%; background: {{ d.bg }}; color: {{ d.fg }}; box-shadow: {{ d.ring }}\">{{ d.n }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B94AB; padding: 0 4px\"><span>LOW<\u002Fspan><span>LIKELIHOOD →<\u002Fspan><span>HIGH<\u002Fspan><\u002Fdiv>\n<div class=\"about\"><span class=\"bdg b-jdg\">JUDGEMENT<\u002Fspan><span><b>Where it comes from · <\u002Fb>my Low / Medium / High rating of each risk from public information only; no SPACES data was used. “With mitigation” shows where I would expect each risk to move if its mitigation works, which is also a judgement. <b>Why it matters · <\u002Fb>it ranks which risks to measure first. Each card names the model that would replace the rating with a measured estimate.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"border-radius: 22px; border: 1px solid rgba(255,90,102,0.35); background: #120E1E; padding: 26px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF8A93\">RISK {{ riskCur.n }} · {{ riskCur.cat }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #AEB6CA\">{{ riskCur.level }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2\">{{ riskCur.title }}<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #AEB6CA\">{{ riskCur.why }}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #D5DAE6\"><span style=\"color: #7FB0FF; font-weight: 600\">How I’d quantify it · <\u002Fspan>{{ riskCur.model }}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #D5DAE6\"><span style=\"color: #5BD6A0; font-weight: 600\">Mitigation · <\u002Fspan>{{ riskCur.mit }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{ riskList }}\" as=\"r\" hint-placeholder-count=\"8\">\n<button class=\"rrow\" sc-camel-on-click=\"{{ r.pick }}\" aria-pressed=\"{{ r.pressed }}\" style=\"background: {{ r.bg }}; border-color: {{ r.bd }}\">\n<span style=\"width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: {{ r.dot }}; color: #0A0D1A; flex: none\">{{ r.n }}<\u002Fspan>\n<span style=\"font-size: 14px; color: #D5DAE6; flex: 1\">{{ r.title }}<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B94AB\">{{ r.cat }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 600\">If a model is wrong, who bears the loss?<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #AEB6CA\">Every model on this page can fail. Before anything goes live, each failure needs a named owner and a guardrail.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"g3\" style=\"gap: 16px\">\n<div style=\"border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">Parkers<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #AEB6CA\">A pricing rule that overreacts charges people too much; a pass rule that oversells leaves a paying customer without a space.<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #D5DAE6\"><span style=\"color: #5BD6A0; font-weight: 600\">Guardrail · <\u002Fspan>price caps, limits on how fast rates move, and a stated risk limit for passes.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">Operators<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #AEB6CA\">Wrong forecasts or benchmarks lead to wrong staffing and pricing decisions, and lost revenue.<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #D5DAE6\"><span style=\"color: #5BD6A0; font-weight: 600\">Guardrail · <\u002Fspan>recommendations rather than autopilot until a pilot proves them; ranges shown with every forecast.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">SPACES<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #AEB6CA\">A model that fails in public damages trust with operators and at renewal.<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #D5DAE6\"><span style=\"color: #5BD6A0; font-weight: 600\">Guardrail · <\u002Fspan>controlled pilots, monitoring against a holdout group, and a one-step switch back to manual.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 TOOLKIT -->\n<section id=\"toolkit\" class=\"slide\" style=\"background: #0B1022\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 44px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">09 · Toolkit &amp; training<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">Econometrics for the why. Code to make it run.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"g3\">\n<div style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"width: 44px; height: 44px; border-radius: 12px; background: rgba(255,90,102,0.15); display: flex; align-items: center; justify-content: center\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FF5A66\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M7 15l4-4 3 3 5-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600\">Econometrics<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">Separating cause from correlation, so SPACES can say what a price change or a SPACES install actually did.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span class=\"chip\">Panel fixed effects<\u002Fspan><span class=\"chip\">Instrumental variables<\u002Fspan><span class=\"chip\">Difference-in-differences<\u002Fspan><span class=\"chip\">Event studies<\u002Fspan><span class=\"chip\">Synthetic control<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"width: 44px; height: 44px; border-radius: 12px; background: rgba(76,141,255,0.15); display: flex; align-items: center; justify-content: center\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4C8DFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"17\" r=\"1.5\"><\u002Fcircle><circle cx=\"10\" cy=\"12\" r=\"1.5\"><\u002Fcircle><circle cx=\"15\" cy=\"13\" r=\"1.5\"><\u002Fcircle><circle cx=\"18\" cy=\"7\" r=\"1.5\"><\u002Fcircle><path d=\"M4 20L20 5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600\">Regression &amp; forecasting<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">Measuring how demand responds to price, time and events, and predicting what comes next.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span class=\"chip\">OLS &amp; log-log demand<\u002Fspan><span class=\"chip\">Logit / probit<\u002Fspan><span class=\"chip\">Survival (Cox)<\u002Fspan><span class=\"chip\">SARIMAX<\u002Fspan><span class=\"chip\">Monte Carlo<\u002Fspan><span class=\"chip\">Newsvendor<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"width: 44px; height: 44px; border-radius: 12px; background: rgba(160,150,255,0.15); display: flex; align-items: center; justify-content: center\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A096FF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 7l-5 5 5 5\"><\u002Fpath><path d=\"M16 7l5 5-5 5\"><\u002Fpath><path d=\"M14 4l-4 16\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600\">Coding<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">Turning models into tools the team uses every day, not one-off reports.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span class=\"chip\">R<\u002Fspan><span class=\"chip\">Google Colab<\u002Fspan><span class=\"chip\">Python<\u002Fspan><span class=\"chip\">Excel models<\u002Fspan><span class=\"chip\">SQL<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 720px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 600\">Methods I bring, and where they fit<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #AEB6CA\">Methods from my graduate training in econometrics, enterprise risk analytics and global supply chains, each matched to where it would be used at SPACES.<\u002Fdiv>\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Filter methods\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ courseTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n<button class=\"tab\" role=\"tab\" aria-selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.pick }}\" style=\"background: {{ t.bg }}; color: {{ t.fg }}; border-color: {{ t.bd }}\">{{ t.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"g3\" style=\"gap: 14px\">\n<sc-for list=\"{{ courseItems }}\" as=\"c\" hint-placeholder-count=\"9\">\n<div class=\"lift\" style=\"border-radius: 18px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{ c.courseCol }}\">{{ c.course }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600; line-height: 1.25\">{{ c.method }}<\u002Fdiv>\n<div style=\"font-size: 13px; line-height: 1.55; color: #8B94AB\"><span style=\"color: #AEB6CA\">What it does · <\u002Fspan>{{ c.inClass }}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #D5DAE6\"><span style=\"color: #FF8A93\">At SPACES · <\u002Fspan>{{ c.spaces }}<\u002Fdiv>\n<div style=\"margin-top: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7FB0FF\">→ {{ c.where }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600\">Which method answers which opportunity<\u002Fdiv>\n<div style=\"font-size: 13px; color: #8B94AB\">Click a row to open that opportunity’s deep dive above<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"about\"><span class=\"bdg b-jdg\">JUDGEMENT<\u002Fspan><span>A dot marks a method I would use for that opportunity. It is my plan, not a measured result.<\u002Fspan><\u002Fdiv>\n<div class=\"mx\">\n<div class=\"mx-row\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B94AB; letter-spacing: 0.04em\">\n<div style=\"border-top: none\">OPPORTUNITY<\u002Fdiv>\n<sc-for list=\"{{ methodCols }}\" as=\"m\" hint-placeholder-count=\"8\"><div style=\"border-top: none; text-align: center\">{{ m }}<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<sc-for list=\"{{ matrix }}\" as=\"r\" hint-placeholder-count=\"6\">\n<button class=\"mx-btn\" sc-camel-on-click=\"{{ r.pick }}\" aria-label=\"{{ r.aria }}\">\n<span class=\"mx-row\" style=\"background: {{ r.bg }}\">\n<div style=\"font-size: 14px; color: {{ r.fg }}; font-weight: 500\">{{ r.n }} · {{ r.title }}<\u002Fdiv>\n<sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"8\">\n<div style=\"display: flex; justify-content: center\"><span style=\"width: 14px; height: 14px; border-radius: 50%; background: {{ c.bg }}; border: 1.5px solid {{ c.bd }}\"><\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 PROCESS -->\n<section id=\"process\" class=\"slide\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">10 · How I work<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">One loop, applied to every opportunity.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">Not a fixed calendar. Each opportunity moves through the same six steps, and the last step feeds the first: what we measure becomes the next question.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ring-stage\">\n<div class=\"ring\" style=\"transform: translateZ(-330px) rotateY({{ ringRot }}deg)\">\n<sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n<div class=\"rcard\" style=\"transform: rotateY({{ s.angle }}deg) translateZ(330px); opacity: {{ s.op }}; background: {{ s.bg }}; border-color: {{ s.bd }}\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #FF5A66\">STEP {{ s.n }}<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 600\">{{ s.title }}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">{{ s.text }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: center; gap: 18px\">\n<button class=\"navbtn\" sc-camel-on-click=\"{{ prevStep }}\" aria-label=\"Previous step\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EEF1F8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #AEB6CA; min-width: 160px; text-align: center\">{{ stepLabel }}<\u002Fdiv>\n<button class=\"navbtn\" sc-camel-on-click=\"{{ nextStep }}\" aria-label=\"Next step\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EEF1F8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 OUTCOMES -->\n<section id=\"outcomes\" class=\"slide\" style=\"background: #0B1022\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 44px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">11 · What SPACES gets<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">From parking technology to revenue intelligence.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">Every opportunity ends in something the team can use, and a metric that shows whether it moved.<\u002Fp>\n<div class=\"about\" style=\"max-width: 780px\"><span class=\"bdg b-con\">NO TARGETS CLAIMED<\u002Fspan><span>Each KPI’s starting level would be measured from SPACES’ data at the start of a pilot, and the target agreed with the team that owns it. No improvement figures are promised here.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 12px 32px\">\n<sc-for list=\"{{ outcomes }}\" as=\"o\" hint-placeholder-count=\"6\">\n<div class=\"g3\" style=\"padding: 20px 0; border-top: {{ o.border }}; align-items: center\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #FF5A66\">{{ o.n }}<\u002Fspan>\n<span style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">{{ o.tool }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #AEB6CA\">{{ o.who }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #7FB0FF\">KPI → {{ o.kpi }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"g3\">\n<div style=\"border-radius: 20px; border: 1px solid rgba(255,255,255,0.09); padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">For operators<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">Prices that follow demand, warnings before busy days, and a clear view of how they compare. A portal they depend on.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 20px; border: 1px solid rgba(255,255,255,0.09); padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">For sales<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">A financial case built from SPACES’ own results, with confidence ranges, that holds up in procurement.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 20px; border: 1px solid rgba(255,255,255,0.09); padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600\">For leadership<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">Growth plans and risk scenarios grounded in data, in the language investors expect.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 CLOSE -->\n<section style=\"padding: 80px 0 100px\">\n<div class=\"wrap\">\n<div style=\"border-radius: 32px; background: #FF5A66; color: #0A0D1A; padding: 64px 56px; display: flex; flex-direction: column; gap: 26px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase\">12 · The ask<\u002Fdiv>\n<div class=\"h2\" style=\"font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; max-width: 880px\">Airlines and hotels have priced with demand data since the 1980s, and cities such as San Francisco have tested demand-based parking prices. SPACES has the data to bring that to garages. I’d like to help build it.<\u002Fdiv>\n<div class=\"about\" style=\"max-width: 880px\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><span>Smith, Leimkuhler &amp; Darrow, <a href=\"https://pubsonline.informs.org/doi/10.1287/inte.22.1.8\" target=\"_blank\" rel=\"noopener\">“Yield Management at American Airlines”<\u002Fa>, <i>Interfaces<\u002Fi> 22(1), 1992 · SFMTA, <a href=\"https://www.sfmta.com/getting-around/drive-park/demand-responsive-pricing/sfpark-evaluation\" target=\"_blank\" rel=\"noopener\">SFpark pilot evaluation<\u002Fa>, 2014.<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 17px; line-height: 1.6; max-width: 720px\">Start with one opportunity, one set of facilities and one clear metric. If the model moves the number, scale it across the network.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<a href=\"#deep\" style=\"background: #0A0D1A; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px; padding: 14px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Revisit the deep dive<\u002Fa>\n<a href=\"https://www.spacesusa.com\" style=\"color: #0A0D1A; text-decoration: none; font-weight: 600; font-size: 15px; padding: 14px 22px; border-radius: 999px; border: 1.5px solid #0A0D1A; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">spacesusa.com<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding-top: 18px; border-top: 1px solid rgba(10,13,26,0.25)\">\n<div style=\"font-family: 'Sora', sans-serif; font-weight: 600; font-size: 17px\">Arshia Goswami<\u002Fdiv>\n<div style=\"font-size: 14px\">MS Quantitative Economics · <a href=\"mailto:goswamiarshia27@gmail.com\" style=\"color: #0A0D1A\">goswamiarshia27@gmail.com<\u002Fa> · <a href=\"https://www.linkedin.com/in/arshiag2003\" style=\"color: #0A0D1A\">linkedin.com/in/arshiag2003<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-top: 28px; font-size: 12px; line-height: 1.7; color: #8B94AB; max-width: 900px\">Sources: <a href=\"https://www.spacesusa.com/article/salesforce-tower\">Salesforce Tower case study<\u002Fa> (entry time, support interactions, self-service) · <a href=\"https://www.spacesusa.com/article/mary-brickell-village\">Mary Brickell Village case study<\u002Fa> (98% within 6 seconds) · <a href=\"https://www.wbgo.org/news/2022-04-14/new-technology-makes-garage-parking-more-attractive-for-ny-nj-commuters\">WBGO, April 2022<\u002Fa> (100+ garages, hybrid-worker daily pricing) · <a href=\"https://www.spacesusa.com\">spacesusa.com<\u002Fa> (product, verticals, operator benefits). Every other number on this site is labelled: CALCULATED numbers are computed live from example inputs in the Models section, ILLUSTRATION values (such as the plate and times in the animation) are fictional, and JUDGEMENT ratings are my own assessment from public information.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:14000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { flipped: {}, prob: 0, surge: false, step: 0, tilt: { x: 0, y: 0 }, fly: 0, flyPaused: false, chainSel: 'v4', shock: -1, shockStep: 0, riskSel: 0, riskMit: false, labTab: 'reg', foaHover: 'none', barHover: -1, lineHover: -1, tornHover: -1, esHover: 'none', courseFilter: 'all', cond: { fac: 0, day: 0, wx: 0, ev: 0 }, lab: { lsF: 120, lsRev: 180, lsHwR: 1, lsHwM: 600, lsMrR: 12, lsMrM: 40, lsDmR: 0.15, lsDmM: 2500, lsXi: 0.4, lsGpd: 1, lsOut: 2, lsDur: 2, lsWide: 25, lsLost: 50, lsDat: 0.02, lsDatM: 150000, lsSla: 20, lsVend: 10, lsDed: 25000, lsLim: 1000000, lsPrem: 30000, lsFixCut: 70, lsFixCost: 40000, lsUnc: 1, lsOps: 40, lsFixWide: 50, lsAgg: 2000000, lsSpike: 1, lsGrow: 25, lsHist: 3, lsBench: 10, ksDeals: 20, ksLanes: 3, ksWin: 40, ksSlip: 25, ksRho: 0.3, ksReg: 3, ksL: 6, ksSdL: 1, ksRev: 2, ksShip: 3, ksCam: 900, ksCtl: 1500, ksNet: 400, ksHold: 30, ksExp: 35, ksExpDays: 5, ksCF: 150, ksBase: 120, ksFail: 5, ksSt1: 8, ksSt2: 6, ksSt3: 4, ksSt4: 2, ksRegShare: 50, ksDis: 5, ksDisWk: 6, ksKnock: 0, ksPack: 10, ksBig: 1, pyCost: 60000, pyCapex: 0, pyQ: 6000, pyPrice: 12, pyHrs: 120, pyWage: 25, pyCons: 200, pyMaint: 400, pyLeak: 0.5, pyUp: 2, pyFee: 1500, pyRate: 0.25, pyFeeT: 0, pyAmax: 90, pyTau: 3, pyDown: 2, pySeas: 10, pyUnc: 30, pyRho: 0.5, pyR: 8, pyHor: 24, pyTerm: 36, fcTest: 28, psC: 300, psT: 150, psH: 0.9, prho: 0.03, psR: 250, psCost: 60, psRed: 0, psRedCost: 15, psFac: 1, psD1: 15, psD2: 3, psD3: 1, psD4: 2, psRcap: 20, psRes: 50, foaFac: 2, foaMu: 360, foaS: 0.75, foaCv: 22, foaPhi: 0.4, foaK: 50, foaD1: 13, foaD2: 3, foaD3: 1, foaD4: 9, foaD5: 4, foaUp: 25, fcFac: 0, fcH: 7, fcFix: 1, fcA1: 90, fcA7: 65, fcAlert: 50, fcDay: 1, pyMeas: 1, pyBaseHrs: 600, pyTrueS: -20, pyTrueR: 2.5, pyHet: 50, pyPre: 0, pySpCost: 40000, pySup: 400, pySales: 8000, pySpR: 10, cens: 1, capR: 1.15, theta: 85, pf: 5, pc: 40, el: -0.4, k: 0.6, wO: -60, wH: -10, wV: 25, rain: -8, snow: -30, heat: -6, conc: 120, surge: 35, cap: 300, price: 20, mu: 270, sd: 60, pn: 100, p: 0.6, tol: 5, cost: 50000, fee: 1000, sL: 1500, sM: 3000, sH: 5000, uL: 0, uM: 1500, uH: 4000, hor: 24, kmu: 40, ksd: 12, co: 300, cu: 1500, kn: 4, rho: 0.2, lam: 6, med: 2000, sig: 1 } };\n    this.surgeOn = false;\n    this.setCanvas = (el) => {\n      if (el && el !== this.cv) { this.cv = el; this.startScene(); }\n      if (!el) { this.stopScene(); this.cv = null; }\n    };\n    this.toggleSurge = () => {\n      this.surgeOn = !this.surgeOn;\n      this.setState({ surge: this.surgeOn });\n    };\n    this.tiltMove = (e) => {\n      const r = e.currentTarget.getBoundingClientRect();\n      const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;\n      this.setState({ tilt: { x: +(-py * 8).toFixed(2), y: +(px * 10).toFixed(2) } });\n    };\n    this.tiltReset = () => this.setState({ tilt: { x: 0, y: 0 } });\n    this.prevStep = () => this.setState({ step: this.state.step - 1 });\n    this.nextStep = () => this.setState({ step: this.state.step + 1 });\n  }\n\n  componentWillUnmount() { this.stopScene(); clearInterval(this.flyTimer); clearInterval(this.shockTimer); }\n\n  extraVals() {\n    const st = this.state;\n    // ---------- Flywheel ----------\n    const F = [\n      { title: 'More facilities on SPACES', text: 'Each new garage, hospital or airport adds another stream of plate-level parking data to the network.', lever: 'Market model: rank where to grow next from what makes existing sites succeed.' },\n      { title: 'More plate-level data', text: 'Entries, exits, dwell times, prices paid and repeat visits, across more verticals, cities and conditions.', lever: 'Data audit and pipelines so every new site is clean, joined and model-ready from day one.' },\n      { title: 'Better models', text: 'More variation in prices, events and facility types gives sharper elasticity estimates, forecasts and fairer benchmarks.', lever: 'Panel regression, causal designs and forecasting that improve as the panel grows.' },\n      { title: 'Better operator results', text: 'Prices that follow demand, warnings before busy days and fewer support calls show up in operators’ revenue and costs.', lever: 'Pricing rule, forecast alerts and intervention fixes, each tested against control facilities.' },\n      { title: 'A stronger case to sell', text: 'Measured results across many sites become a payback calculator that wins the next facility, and the loop turns again.', lever: 'Causal ROI model and calculator with confidence ranges by vertical.' }\n    ];\n    const fa = st.fly % F.length;\n    const flyNodes = F.map((f, i) => {\n      const a = (-90 + i * 72) * Math.PI / 180;\n      const on = i === fa;\n      return {\n        ...f, n: i + 1, x: Math.round(240 + 190 * Math.cos(a) - 75), y: Math.round(240 + 190 * Math.sin(a) - 30),\n        bg: on ? '#FF5A66' : '#0F1630', bd: on ? '#FF5A66' : 'rgba(255,255,255,0.14)', fg: on ? '#0A0D1A' : '#EEF1F8', numc: on ? '#0A0D1A' : '#FF8A93',\n        bar: on ? '#FF5A66' : 'rgba(255,255,255,0.12)', pressed: on ? 'true' : 'false',\n        pick: () => this.setState({ fly: i, flyPaused: true })\n      };\n    });\n    const flyCur = { ...F[fa], n: fa + 1 };\n\n    // ---------- Chains ----------\n    const C = {\n      h1: { code: 'P1', title: 'Hardware sourcing', sub: 'LPR cameras, gate controllers', what: 'Cameras and controllers are bought and shipped for each new facility.', risk: 'Reliance on one supplier means a single delay stalls every install in the pipeline.', measure: 'Supplier concentration, lead times and how often parts arrive late.' },\n      h2: { code: 'P2', title: 'Integration & install', sub: 'Fitted to existing gates', what: 'SPACES fits its system to the facility’s existing gates, with far less hardware than a legacy PARCS.', risk: 'Site surveys, permits and hand-offs between teams can overrun.', measure: 'Time spent in each step from signed contract to live, and which steps overrun most.' },\n      h3: { code: 'P3', title: 'Go-live & calibration', sub: 'Read accuracy tuned', what: 'Cameras are tuned for the site’s lighting, angles and traffic before parkers rely on them.', risk: 'Poor calibration shows up later as misreads and support calls.', measure: 'Read confidence and intervention rate in the first weeks after launch.' },\n      h4: { code: 'P4', title: 'Support & maintenance', sub: '24/7 operator support', what: 'Operators and parkers get help around the clock; hardware is serviced.', risk: 'Support cost grows with every site unless the causes of calls fall.', measure: 'Support cost per park and the drivers of each intervention.' },\n      v1: { code: 'D1', title: 'Parker arrives', sub: 'Drive in', what: 'A driver pulls up. Demand depends on time, day, events, weather and the local economy.', risk: 'Demand shifts with commuting patterns, travel and events.', measure: 'Entries by hour against calendar, weather and macro drivers.' },\n      v2: { code: 'D2', title: 'Plate read', sub: 'LPR at the gate', what: 'The camera reads the plate and the gate opens with no ticket.', risk: 'Misreads in poor light or with damaged plates need human help.', measure: 'Read confidence and intervention events, park by park.' },\n      v3: { code: 'D3', title: 'Mobile payment', sub: 'Ticketless, contactless', what: 'The parker pays on their phone; the price comes from the operator’s rate.', risk: 'Payment friction or the wrong price loses revenue.', measure: 'Price paid, product chosen and payment completion.' },\n      v4: { code: 'D4', title: 'Data platform', sub: 'Every park recorded', what: 'Each park becomes a timestamped record: entry, exit, dwell, price, validation, repeat visit.', risk: 'Gaps or inconsistent records weaken every model built on top.', measure: 'Data completeness and consistency across facilities.' },\n      v5: { code: 'D5', title: 'Operator portal', sub: 'Reporting & rates', what: 'Operators see their transactions and set rates.', risk: 'A portal used only for reporting is easier to replace at renewal.', measure: 'Which features operators use, and how use links to renewal.' },\n      v6: { code: 'D6', title: 'Pricing & decisions', sub: 'Rates, validations, staffing', what: 'Operators decide prices, validations and staffing.', risk: 'Wrong prices leave revenue on the table or spaces empty.', measure: 'Elasticities, forecasts and the revenue effect of each change.' }\n    };\n    const SH = [\n      { name: 'Camera supplier delay', path: ['h1', 'h2', 'h3', 'v5'], story: 'A delay at one hardware supplier holds up installs, pushes back go-live, and delays the day the operator and SPACES start earning from that site.', method: 'Duration (survival) model of contract-to-live time by step, a supplier concentration index, and a cost-of-delay model: expected revenue per facility-week times weeks lost.' },\n      { name: 'Office occupancy drops', path: ['v1', 'v3', 'v4', 'v5', 'v6'], story: 'Fewer commuters means fewer entries and payments, thinner data at office sites, and operators who need to re-price quickly.', method: 'Panel regression of facility entries on local office-occupancy and hybrid-work indicators, giving demand’s sensitivity to the macro driver, fed into base, upside and stress scenarios.' },\n      { name: 'Major client exits', path: ['v5', 'v4', 'v6', 'h4'], story: 'Losing a large operator removes portal revenue and a block of data, weakens benchmarks for similar sites, and spreads fixed support cost over fewer parks.', method: 'Revenue concentration analysis, a Monte Carlo of revenue at risk, and a churn hazard model that flags at-risk clients early.' },\n      { name: 'LPR misreads rise', path: ['v2', 'h4', 'v3', 'v5'], story: 'More misreads mean more operator interventions, slower payment, higher support cost and a weaker story at renewal.', method: 'Logit model of intervention events on read confidence, lighting, time and parker history, plus a support cost-per-park model.' }\n    ];\n    SH.push({ name: 'Tariff on imported parts', path: ['h1', 'h2', 'h3'], story: 'If any hardware components are imported, a tariff raises the cost of each new install and can lead buyers to delay.', method: 'Scenario stress test on install cost and payback (the tornado in Model 4), plus supplier-selection analysis of alternative sources.' });\n    const TOOLS = {\n      h1: 'Supplier selection with an optimization model, and watching for the bullwhip effect as the sales pipeline swings.',\n      h2: 'Delayed differentiation: one standard kit, configured per facility type at the last step.',\n      h3: 'Process metrics from day one, so calibration problems show up in data before they show up as support calls.',\n      h4: 'Risk pooling: shared support capacity across facilities needs less buffer than staffing each site separately.',\n      v1: 'Forecasting with prediction intervals.',\n      v3: 'Flaw of Averages and binomial pass limits.',\n      v6: 'Stress testing and guardrails before any price rule goes live.'\n    };\n    const sk = st.shock;\n    const path = sk >= 0 ? SH[sk].path : [];\n    const mk = (id, i, arr) => {\n      const c = C[id];\n      const pi = path.indexOf(id);\n      const hit = pi >= 0 && pi < st.shockStep;\n      const sel = st.chainSel === id;\n      const nextHot = hit && i < arr.length - 1 && path.indexOf(arr[i + 1]) >= 0 && path.indexOf(arr[i + 1]) < st.shockStep;\n      return {\n        ...c, hit, order: pi + 1, notLast: i < arr.length - 1, cls: hit ? 'hot' : '', connCls: nextHot ? 'hot' : '',\n        pressed: sel ? 'true' : 'false',\n        bg: hit ? 'rgba(255,90,102,0.16)' : (sel ? '#172042' : '#0F1630'),\n        bd: hit ? '#FF5A66' : (sel ? '#7FB0FF' : 'rgba(255,255,255,0.12)'),\n        pick: () => this.setState({ chainSel: id })\n      };\n    };\n    const A = ['h1', 'h2', 'h3', 'h4'], B = ['v1', 'v2', 'v3', 'v4', 'v5', 'v6'];\n    const chainA = A.map(mk), chainB = B.map(mk);\n    const chainCur = { ...C[st.chainSel], tool: TOOLS[st.chainSel] || '', hasTool: !!TOOLS[st.chainSel] };\n    const shockTabs = SH.map((s, i) => {\n      const on = i === sk;\n      return { name: s.name, pressed: on ? 'true' : 'false', bg: on ? '#FF5A66' : 'transparent', fg: on ? '#0A0D1A' : '#D5DAE6', bd: on ? '#FF5A66' : 'rgba(255,255,255,0.14)', pick: () => this.setState({ shock: on ? -1 : i, shockStep: 0 }) };\n    });\n    const shockCur = sk >= 0\n      ? { ...SH[sk], active: true, bd: 'rgba(255,90,102,0.45)', bg: '#160F1C' }\n      : { name: 'No shock selected', story: 'Choose a shock above. The links it hits light up in order, so you can see how a problem in one place travels through the business.', method: '', active: false, bd: 'rgba(255,255,255,0.09)', bg: '#0D1326' };\n\n    // ---------- Risk ----------\n    const R = [\n      { title: 'Client concentration', cat: 'Commercial', now: [2, 3], mitP: [2, 2], why: 'If a few large operators or properties make up much of revenue, one exit hits hard. It is usually the first question investors ask.', model: 'Concentration index on revenue by client, a Monte Carlo of revenue at risk, and a churn hazard model on usage signals.', mit: 'Health scores and peer benchmarks for early intervention; spread revenue across verticals and regions.' },\n      { title: 'Hybrid-work demand shock', cat: 'Macro', now: [2, 3], mitP: [2, 2], why: 'Office parking depends on commuting patterns that hybrid work has already changed, which SPACES itself has pointed to (WBGO, 2022).', model: 'Panel regression of entries on office-occupancy indicators, feeding base, upside and stress scenarios.', mit: 'Flexible daily and multi-entry products; growth in airports, hospitals and event venues where demand behaves differently.' },\n      { title: 'Single-source hardware', cat: 'Supply chain', now: [2, 2], mitP: [1, 2], why: 'Relying on one supplier for cameras or controllers means one delay stalls every install.', model: 'Supplier concentration ana Fin.beta[1], bias = Nv.beta[1] - P.el;\n      const p100 = (v) => (v > 0 ? '+' : '') + v + '%';\n\n      // ---- Step 2: price rule for the selected conditions ----\n      const c = st.cond, f = c.fac, v = this.condVec(c);\n      const P0 = 15, theta = P.theta / 100, Pf = P.pf, Pc = Math.max(P.pc, P.pf);\n      const Cf = Math.exp(R.cap[f]);\n      const lg = (x) => Math.log(1 + x / 100);\n      const trueLnQ = R.base[f] + (c.day === 1 ? R.wk[f] : 0) + (c.wx === 1 ? lg(P.rain) : c.wx === 2 ? lg(P.snow) : c.wx === 3 ? lg(P.heat) : 0) + (c.ev === 1 && f === 2 ? lg(P.conc) : 0) + (c.ev === 1 && f === 1 ? lg(P.surge) : 0);\n      const Qtrue = Math.exp(trueLnQ);\n      const lnQhat = (B) => B[0] + B[1] * Math.log(P0) + (f === 1 ? B[12] : 0) + (f === 2 ? B[13] : 0) + v.reduce((s, x, j) => s + x * B[j], 0);\n      const Qfin = Math.exp(lnQhat(Fin.beta));\n      const Qnaive = Math.exp(Nv.beta[0] + Nv.beta[1] * Math.log(P0));\n      const clamp = (x) => Math.min(Pc, Math.max(Pf, x));\n      const priceFor = (beta, Qh) => (beta < -0.02 ? clamp(P0 * Math.pow(Qh / (theta * Cf), -1 / beta)) : null);\n      const outcome = (Pstar) => { const q = Qtrue * Math.pow(Pstar / P0, P.el); return { occ: Math.min(1, q / Cf), rev: Pstar * Math.min(q, Cf), turned: Math.max(0, q - Cf) }; };\n      const money2 = (x) => '$' + x.toFixed(2);\n      const tile = (label, beta, Qh, bd) => {\n        const ps = priceFor(beta, Qh);\n        if (ps === null) return { label, value: 'No valid price', note: 'β = ' + beta.toFixed(2) + ': a non-negative elasticity says higher prices bring more cars, so the rule cannot be applied.', bd };\n        const o = outcome(ps);\n        return { label, value: money2(ps), note: 'β = ' + beta.toFixed(2) + ' · true occupancy ' + Math.round(o.occ * 100) + '% (target ' + P.theta + '%) · revenue ' + money(o.rev) + '/day' + (o.turned > 0.5 ? ' · ' + Math.round(o.turned) + ' cars turned away' : ''), bd };\n      };\n      const priceTiles = [\n        tile('Benchmark: true elasticity', P.el, Qtrue, 'rgba(255,255,255,0.12)'),\n        tile('Using the price-only estimate', Nv.beta[1], Qnaive, 'rgba(255,90,102,0.5)'),\n        tile('Using the full model', bFin, Qfin, 'rgba(91,214,160,0.55)')\n      ];\n      const inel = bFin > -1 && bFin < 0;\n      // numbers behind each price: spaces, target cars, expected cars, cars that park, revenue\n      const n0 = (x) => Math.round(x).toLocaleString('en-US');\n      const colFor = (beta, Qh) => {\n        const ps = priceFor(beta, Qh);\n        if (ps === null) return { beta, Qh, ps: null };\n        const raw = P0 * Math.pow(Qh / (theta * Cf), -1 / beta);\n        const q = Qtrue * Math.pow(ps / P0, P.el);\n        return { beta, Qh, ps, bound: raw > Pc ? 'cap' : raw < Pf ? 'floor' : '', park: Math.min(q, Cf), occ: Math.min(1, q / Cf), turned: Math.max(0, q - Cf), rev: ps * Math.min(q, Cf) };\n      };\n      const cols = [colFor(P.el, Qtrue), colFor(Nv.beta[1], Qnaive), colFor(bFin, Qfin)];\n      const cell = (fn) => cols.map((c) => (c.ps === null && fn.needP ? '—' : fn(c)));\n      const needP = (fn) => { fn.needP = true; return fn; };\n      const ptRows = [\n        ['Elasticity used (β)', 'true value / estimate', cell((c) => c.beta.toFixed(2))],\n        ['Spaces (C)', 'set by the capacity slider', cell(() => n0(Cf))],\n        ['Target cars (θ × C)', P.theta + '% of ' + n0(Cf) + ' spaces', cell(() => n0(theta * Cf))],\n        ['Expected cars at $' + P0 + ' (Q̂)', 'true demand / model estimate', cell((c) => n0(c.Qh))],\n        ['Price set (P*)', 'P₀ × (Q̂ ÷ target cars)^(1/|β|), within floor and cap', cell(needP((c) => money2(c.ps) + (c.bound ? ' (' + c.bound + ')' : '')))],\n        ['Cars that actually park', 'true demand at that price, at most C', cell(needP((c) => n0(c.park)))],\n        ['Occupancy', 'cars that park ÷ spaces', cell(needP((c) => Math.round(c.occ * 100) + '%'))],\n        ['Cars turned away', 'true demand above C', cell(needP((c) => n0(c.turned)))],\n        ['Revenue per day', 'price × cars that park', cell(needP((c) => money(c.rev)))]\n      ].map(([k, how, v]) => ({ k, how, a: v[0], b: v[1], c: v[2] }));\n      L = {\n        priceTable: ptRows, hasPriceTable: true,\n        priceTableNote: 'Spaces = typical clear-weekday demand at this facility × ' + P.capR.toFixed(2) + '. “Expected cars” uses the conditions picked above: the benchmark column uses the true effects you set, the other two use what each regression estimated. Every column is then tested against the same true demand, so the last four rows show what would really happen at that price. Example inputs only.',\n        hasEq: true, eq: 'ln Q(f,t) = α_f + τ(t) + β·ln P(f,t) + γ′X(f,t) + ε(f,t)\\nFull days: observed ln Q = min( ln Q*, ln C )  →  censored (Tobit) regression', eqNote: 'α_f are facility fixed effects, τ(t) weekday/weekend and season, β the price elasticity and X the drivers (weather, events, emergency surges). Days at capacity are treated as censored. Standard errors are clustered by date. Step 2 below turns β into a price.', guide: {\"sources\": [{\"k\": \"True effects and elasticity (sliders)\", \"v\": \"Set by you as examples, so the regression can be checked against a known truth\"}, {\"k\": \"Real elasticity\", \"v\": \"Estimated from SPACES plate-read counts and prices by facility and hour, confirmed with controlled price tests\"}, {\"k\": \"Weather\", \"v\": \"Historical weather records joined by date and location\"}, {\"k\": \"Events and emergencies\", \"v\": \"Venue and city event calendars; hospital activity where partners share it\"}, {\"k\": \"Capacity\", \"v\": \"Space counts per facility from SPACES and operators\"}, {\"k\": \"Floor, cap, target occupancy\", \"v\": \"Business decisions agreed by SPACES and each operator\"}, {\"k\": \"How much operators raise prices on busy days (slider)\", \"v\": \"A setting of the simulation, not a SPACES number: it creates the bias the model has to correct. In real data the same pattern is read from SPACES’ price history\"}, {\"k\": \"Fixed settings in this simulation\", \"v\": \"3 example garages (office, hospital, concert venue) with normal-weekday demand of 300, 220 and 180 cars, simulated for 2 years; base price $15; concerts on 45% of weekend and 15% of weekday days, hospital surges on 6% of days; rain, snow and heat by month; day-to-day noise and a city-wide shock that carries over (0.6). All are examples chosen so the regression can be checked, not SPACES data\"}], \"read\": [\"Three tiles: the true elasticity, what a price-only regression finds, and what the full model finds. The gap between the first two is the cost of leaving drivers out.\", \"Table: “left out” means that driver is not in that regression; the last column is a 90% interval clustered by date.\", \"Step 2: the table walks through each price step by step (spaces, target cars, expected cars, price, cars that park, revenue) so every number can be checked by hand; the cards below it summarise each price, tested against true demand. The full-model price should land near the benchmark.\", \"If a note says the cap binds, demand exceeds what any allowed price can manage: review the cap or capacity for those days.\"], \"pilot\": [\"Pull 12–24 months of hourly entries, exits, prices and capacity for 5–10 facilities across 2–3 verticals.\", \"Join weather, event calendars and holidays; estimate with clustering and the full-garage correction; check on held-out months.\", \"Agree a price floor and cap with operators, then run a controlled price test at a few facilities against matched controls for 8–12 weeks.\", \"Judge it on revenue per space and occupancy versus the controls.\", \"Owners: analytics (model), operations and operators (sign-off on prices). Roughly 3 months end to end.\"]}, kicker: 'MODEL 0 · DEMAND DRIVERS, FULL GARAGES AND PRICE', title: 'Separate price from everything else that moves demand, then set the price',\n        question: 'Demand swings with weekdays and weekends, rain, snow, heat, concerts and hospital emergencies, and a full garage hides how many more cars wanted to park. Step 1 estimates the price effect with all of that accounted for. Step 2 turns it into a price for the conditions you pick above.',\n        hasToggle: true,\n        toggleTitle: 'Garages fill up (censored demand)',\n        toggleNote: 'When a garage is full, the data records parks = spaces, not the demand turned away. Switch on to see the bias and the correction.',\n        toggleText: P.cens ? 'Full garages: on' : 'Full garages: off', togglePressed: P.cens ? 'true' : 'false',\n        toggleBg: P.cens ? '#FF5A66' : 'rgba(255,255,255,0.08)', toggleFg: P.cens ? '#0A0D1A' : '#EEF1F8',\n        toggle: () => this.setState({ lab: { ...this.state.lab, cens: this.state.lab.cens ? 0 : 1 } }),\n        inputs: [inp('el', 'True price elasticity', -1.5, 0, 0.05, (v) => v.toFixed(2)), inp('k', 'How much operators raise prices on busy days', 0, 1.5, 0.05, (v) => v.toFixed(2)), inp('wO', 'Weekend effect · office', -90, 20, 5, p100), inp('wH', 'Weekend effect · hospital', -50, 30, 5, p100), inp('wV', 'Weekend effect · concert venue', -30, 100, 5, p100), inp('rain', 'Rain', -40, 10, 1, p100), inp('snow', 'Snow', -70, 10, 1, p100), inp('heat', 'Extreme heat', -40, 10, 1, p100), inp('conc', 'Concert or game day', 0, 300, 5, p100), inp('surge', 'Hospital emergency surge', 0, 150, 5, p100), inp('capR', 'Spaces (vs a typical weekday)', 0.9, 2, 0.05, (v) => n0(Cf) + ' · ' + v.toFixed(2) + '×'), inp('theta', 'Target occupancy θ', 50, 100, 1, (v) => v + '%'), inp('pf', 'Price floor', 1, 30, 1, money), inp('pc', 'Price cap', 10, 80, 1, money)],\n        tiles: [\n          { label: 'True price elasticity (set by you)', value: P.el.toFixed(2), note: 'what a perfect model would find', bd: 'rgba(255,255,255,0.09)' },\n          { label: 'Price only: drivers left out', value: Nv.beta[1].toFixed(2), note: 'off by ' + (bias >= 0 ? '+' : '') + bias.toFixed(2), bd: 'rgba(255,90,102,0.5)' },\n          { label: T ? 'All drivers + full-garage fix' : 'All drivers included', value: bFin.toFixed(2), note: '90% CI ' + (bFin - 1.645 * Fin.sec[1]).toFixed(2) + ' to ' + (bFin + 1.645 * Fin.sec[1]).toFixed(2) + ' (clustered by date)', bd: 'rgba(76,141,255,0.5)' }\n        ],\n        hasChart: false, hasTable: true, table, tableTitle: 'Regression results: true effects vs estimates', tableHead: ['FACTOR', 'TRUE', 'PRICE ONLY', 'ALL DRIVERS · OLS', '+ FULL-GARAGE FIX', '90% CI · CLUSTERED'], usesConditions: true, hasPrice: true, priceTiles,\n        tableNote: R.n.toLocaleString('en-US') + ' facility-days simulated (3 facilities × 2 years) from the effects you set, with a city-wide shock shared by all facilities each day that persists from one day to the next. ' + (P.cens ? Math.round(R.shareCens * 100) + '% of facility-days hit capacity. ' : '') + 'Regression: ln(parks) on ln(price), weekend by facility type, weather, events, emergency surges, seasonality and facility fixed effects. Weather hits every facility on the same day, so clustering by date matters: the rain coefficient’s standard error is ' + F.se[5].toFixed(3) + ' assuming independent observations vs ' + F.sec[5].toFixed(3) + ' clustered by date.',\n        priceEq: 'Q(P) = Q̂ · (P / P₀)^β\\nP* = min( P_cap , max( P_floor , P₀ · (Q̂ / θC)^(−1/β) ) )',\n        priceEqNote: 'Q̂ is expected demand at the base price P₀ = $15 under the conditions you picked (from step 1), C is the number of spaces and θ the target occupancy. P* is the price at which expected demand fills θ of the spaces, kept between the floor and the cap. Each price is then tested against the true demand you set.',\n        priceNote: (inel ? 'Why a target, not “maximise revenue”: with inelastic demand (β̂ = ' + bFin.toFixed(2) + ', between 0 and −1), revenue P·Q rises with every price increase, so a pure revenue-maximiser would always pick the cap. The target occupancy and the cap are therefore business choices, as in demand-based parking programmes that aim to keep a few spaces free. ' : 'With elastic demand (β̂ below −1), the revenue-maximising price is the one that just fills the garage (θ = 100%), within the floor and cap. ') + (priceFor(bFin, Qfin) !== null && priceFor(bFin, Qfin) >= Pc - 1e-9 ? 'Under these conditions even the cap cannot bring demand down to the target, so the cap binds and cars are turned away: a signal to review the cap or add capacity for these days. ' : '') + 'The wrong elasticity gives the wrong price: compare the three cards.',\n        hasChecklist: true,\n        checklist: [\n          { t: 'Use controlled price tests.', d: 'Small randomised price changes across facilities and days (or instruments and before-and-after comparisons against control sites) handle price changes made for reasons nobody recorded.' },\n          { t: 'Let the price effect vary.', d: 'Separate elasticities by facility type, hour and customer type, and leave out validated parkers who don’t pay.' },\n          { t: 'Add more drivers.', d: 'Holidays, school calendars, transit disruptions, road closures, local office occupancy, nearby competitor prices, temperature as a continuous variable, flu season, a time trend and a post-2020 break.' },\n          { t: 'Use hourly data.', d: 'Replace the weekend term with hour-of-week effects τ(t), since parking demand peaks within the day.' },\n          { t: 'Cluster by facility and allow for persistence.', d: 'With many facilities, cluster standard errors by date and by facility, and allow for demand shocks that carry over from day to day (clustering by week or Newey–West errors).' },\n          { t: 'Validate out of sample.', d: 'Fit on year one, test on year two, and run placebo tests where a fake price change should show no effect.' },\n          { t: 'Model switching and the long run.', d: 'Estimate cross-price effects between nearby SPACES garages, and separate short-run from long-run responses for monthly parkers.' }\n        ],\n        insight: (Math.abs(bias) > 0.05\n          ? 'Leaving the drivers out moves the price elasticity from ' + P.el.toFixed(2) + ' to ' + Nv.beta[1].toFixed(2) + ': operators already raise prices on days that are busy anyway, so price gets the credit for weekends and events. '\n          : 'With operators barely changing prices on busy days, leaving the drivers out does little harm here; raise “how much operators raise prices on busy days” to see the bias. ')\n          + (T ? 'Full garages add a second bias: ordinary regression with all drivers gives ' + F.beta[1].toFixed(2) + ', because capped days hide demand. The censored-demand (Tobit) model recovers ' + T.beta[1].toFixed(2) + '.' : 'With every driver included, the estimate is ' + F.beta[1].toFixed(2) + '.'),\n        why: 'Each coefficient measures one factor’s effect holding the others fixed, so a factor that moves both price and demand must be included or its effect is credited to price (omitted-variable bias). When garages fill, observed parks are capped at capacity; a censored-regression (Tobit) model treats those days as “demand was at least this much” instead of “demand was exactly this”.',\n        limits: 'The data here are simulated from effects you set, so every estimate can be checked against a known truth. Real data have drivers nobody recorded and effects that differ across facilities and hours; the checklist below covers how I would handle those.',\n        data: 'Join plate-read counts by hour to weather records, event calendars, holidays, hospital activity where available, facility type and capacity, then estimate these effects for each SPACES facility before any number is used for pricing or forecasts.'\n      };\n    } else if (st.labTab === 'foa') {\n      const money0 = (v) => (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');\n      const n0 = (x) => Math.round(x).toLocaleString('en-US');\n      const n1 = (x) => (Math.round(x * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });\n      // ---- effects estimated by Model 0 for the facility chosen here ----\n      const Bh = this.regFit().fin.beta, bHat = Bh[1];\n      const fac = P.foaFac, facNames = ['Office', 'Hospital', 'Concert venue'];\n      const eWk = Math.exp(Bh[2 + fac]), eRain = Math.exp(Bh[5]), eSnow = Math.exp(Bh[6]), eEv = fac === 2 ? Math.exp(Bh[8]) : fac === 1 ? Math.exp(Bh[9]) : 1;\n      const evName = fac === 2 ? 'Concert or game days' : fac === 1 ? 'Emergency-surge days' : 'Event days (no event effect for offices)';\n      const C = P.cap, price = P.price, s = P.foaS, cv = P.foaCv / 100, phi = P.foaPhi, K = P.foaK;\n      const sig = Math.sqrt(Math.log(1 + cv * cv));\n      const theta = P.theta / 100, Pc = Math.max(price, Math.min(P.pc, price * (1 + P.foaUp / 100)));\n      const types = [\n        { name: 'Normal weekdays', d: P.foaD1, m: 1, mh: 1, how: 'baseline' },\n        { name: 'Rainy weekdays', d: P.foaD2, m: eRain, mh: eRain, how: 'rain ×' + eRain.toFixed(2) },\n        { name: 'Snowy weekdays', d: P.foaD3, m: eSnow, mh: eSnow, how: 'snow ×' + eSnow.toFixed(2) },\n        { name: 'Weekend days', d: P.foaD4, m: eWk, mh: eWk, how: 'weekend ×' + eWk.toFixed(2) + ' (' + facNames[fac].toLowerCase() + ')' },\n        { name: evName, d: P.foaD5, m: eEv, mh: 1, how: fac === 0 ? 'treated like a normal weekday' : 'event ×' + eEv.toFixed(2) + ' on daily parkers' }\n      ].map((t) => {\n        const mu = P.foaMu * t.m, pt = Math.min(0.99, P.p * P.psH * t.mh), hold = Math.min(C, K * pt), S = Math.max(0, C - hold), peak = s * mu;\n        const planParks = mu - Math.max(0, peak - S);\n        let Pj = price;\n        if (bHat < -0.02 && S > 0 && peak >= S) Pj = Math.min(Pc, Math.max(price, price * Math.pow(peak / (theta * S), -1 / bHat)));\n        return { ...t, mu, pt, hold, S, peak, planParks, Pj };\n      });\n      const days = types.reduce((a, t) => a + t.d, 0);\n      const passRev = K * P.psR;\n      // ---- plans ----\n      const muBar = days ? types.reduce((a, t) => a + t.d * t.mu, 0) / days : 0, SBar = days ? types.reduce((a, t) => a + t.d * t.S, 0) / days : 0;\n      const planAvgParks = days * (muBar - Math.max(0, s * muBar - SBar));\n      const planTypeParks = types.reduce((a, t) => a + t.d * t.planParks, 0);\n      const planAvgFull = s * muBar >= SBar ? days : 0, planTypeFull = types.reduce((a, t) => a + (t.peak >= t.S ? t.d : 0), 0);\n      // ---- simulate months: lognormal demand, shocks that carry over from day to day ----\n      const r = this.rng(616), M = 1200;\n      const gauss = () => Math.sqrt(-2 * Math.log(r() || 1e-12)) * Math.cos(2 * Math.PI * r());\n      const seq = []; types.forEach((t, j) => { for (let q = 0; q < t.d; q++) seq.push(j); });\n      for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = seq[i]; seq[i] = seq[j]; seq[j] = tmp; }\n      const acc = types.map(() => ({ n: 0, full: 0, lost: 0, rev: 0, full2: 0, rev2: 0 }));\n      const monthRev = [], monthRev2 = [], ratios = [];\n      let simWanted = 0, simLost = 0, simSold = 0, simFull = 0, simWanted2 = 0, simLost2 = 0, simFull2 = 0, simRevD2 = 0;\n      for (let mth = 0; mth < M; mth++) {\n        let z = gauss(), rev = 0, rev2 = 0;\n        for (let t = 0; t < seq.length; t++) {\n          if (t > 0) z = phi * z + Math.sqrt(1 - phi * phi) * gauss();\n          const ty = types[seq[t]], a = acc[seq[t]];\n          const D = ty.mu * Math.exp(sig * z - sig * sig / 2);\n          const ex = Math.max(0, s * D - ty.S), sold = D - ex, full = s * D >= ty.S ? 1 : 0;\n          rev += price * sold; a.n++; a.full += full; a.lost += ex; a.rev += price * sold;\n          simWanted += D; simLost += ex; simSold += sold; simFull += full;\n          if (ty.S > 0) ratios.push(s * D / ty.S);\n          const D2 = D * Math.pow(ty.Pj / price, bHat), ex2 = Math.max(0, s * D2 - ty.S), full2 = s * D2 >= ty.S ? 1 : 0;\n          rev2 += ty.Pj * (D2 - ex2); a.full2 += full2; a.rev2 += ty.Pj * (D2 1, 60, 1, money0), inp('foaMu', 'Daily parks wanted, normal weekday', 20, 2000, 10), inp('foaS', 'Share of the day’s parkers there at the peak hour', 0.3, 1, 0.01, pct), inp('foaCv', 'Day-to-day swing in demand', 0, 60, 1, (v) => '±' + v + '%'), inp('foaPhi', 'Carry-over of demand shocks to the next day', 0, 0.95, 0.05, (v) => v.toFixed(2)), inp('foaK', 'Monthly passes sold (Model 3 show-up and price)', 0, 600, 10), inp('foaUp', 'Largest busy-day price rise', 0, 100, 5, (v) => '+' + v + '%'),\n          inp('foaD1', 'Normal weekdays in the month', 0, 25, 1), inp('foaD2', 'Rainy weekdays', 0, 15, 1), inp('foaD3', 'Snowy weekdays', 0, 15, 1), inp('foaD4', 'Weekend days', 0, 12, 1), inp('foaD5', fac === 0 ? 'Event days (offices: no effect)' : fac === 1 ? 'Emergency-surge days' : 'Concert or game days', 0, 15, 1)],\n        tiles: [\n          { label: 'Plan: the month’s average day', value: money0(planAvg), note: 'plan by day type: ' + money0(planType), bd: 'rgba(255,255,255,0.09)' },\n          { label: 'Simulated month (average)', value: money0(simMean), note: 'bad month (1 in 10) ' + money0(p10) + ' · good month ' + money0(p90), bd: 'rgba(76,141,255,0.5)' },\n          { label: 'Full days per month', value: n1(perM(simFull)), note: n0(perM(simLost)) + ' parks lost at the peak a month · with busy-day pricing ' + n1(perM(simFull2)) + ' full days', bd: 'rgba(255,90,102,0.5)' }\n        ],\n        insight: 'At this ' + facNames[fac].toLowerCase() + ' garage, a plan built on the month’s average day says ' + money0(planAvg) + '; planning each day type separately says ' + money0(planType) + '; a realistic month averages ' + money0(simMean) + ', and 1 month in 10 comes in below ' + money0(p10) + '. ' + (gapAvg > 0.5 ? 'The average-day plan overstates the month by ' + money0(gapAvg) + ' (' + pct(gapAvg / (planAvg || 1)) + '), because it blends the days that fill with the days that don’t. ' : 'The garage rarely fills at the peak, so plans and reality agree. ') + (simMean2 >
