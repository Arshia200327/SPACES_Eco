onth mix\", \"v\": \"Weather records and the venue or hospital event calendar\"}, {\"k\": \"Passes\", \"v\": \"Pass sales and holder show-up from Model 3\"}, {\"k\": \"Busy-day price rule\", \"v\": \"Model 0’s elasticity and the target occupancy and cap agreed with the operator\"}, {\"k\": \"Day-to-day swing and carry-over (sliders)\", \"v\": \"Placeholders; in a real run, the size of Model 0’s leftover variation and how strongly it carries from one day to the next, per facility\"}, {\"k\": \"Largest busy-day price rise (slider)\", \"v\": \"A business choice agreed with the operator, like the price cap in Model 0\"}, {\"k\": \"Fixed settings in this simulation\", \"v\": \"1,200 simulated months; pass holders use Model 3’s show-up and price, with weekends and weather applied to them too; cars that cannot fit at the peak are counted as lost. These are modelling choices, not SPACES data\"}],\n          \"read\": [\"First tile: what a plan built on the month’s average day promises; its note gives the plan by day type.\", \"Second tile: the realistic month from 1,200 simulated months, with a bad and a good month (1 in 10 each). Budget against the range, not one number.\", \"Third tile: full days and parks lost at the peak, and how busy-day pricing changes them.\", \"Day-type table: each kind of day’s demand, peak against drive-in spaces, full days and busy-day price.\", \"Month table: follows the four columns from parks wanted to total revenue, so every number can be checked by hand.\", \"Chart: peak demand as a share of the drive-in spaces on every simulated day. Red is full days; grey shows how far over the peaks would go. Hover or tap a bar for its values.\"],\n          \"pilot\": [\"Run it for every facility on last year’s data, by month.\", \"Compare each month’s plan with what actually happened; the model should explain most of the gap.\", \"Rank facilities by full days and parks lost at the peak; the top of the list are the strongest candidates for the pricing pilot.\", \"Owner: analytics. About 2–3 weeks once data is available.\"]}\n      };\n    } else if (st.labTab === 'fc') {\n      const n0 = (x) => Math.round(x).toLocaleString('en-US');\n      const R = this.regFit();\n      const f = P.fcFac, facNames = ['Office', 'Hospital', 'Concert venue'], fname = facNames[f].toLowerCase();\n      const S = R.ser[f], Tn = S.length, test = P.fcTest, H = P.fcH, fixOn = !!P.fcFix;\n      const lnCap = R.cap[f], Cap = Math.exp(lnCap);\n      const yTrue = S.map((s2) => s2.lnQ), yObs = yTrue.map((v) => Math.min(v, lnCap));\n      const start = 7, trainEnd = Tn - test;\n      // drivers: weekend, rain, snow, heat, event, surge (only those that vary), season (sin, cos), log price\n      const cols = [0, 1, 2, 3, 4, 5];\n      const keep = cols.filter((j) => { let a = 0; for (let t = start; t < trainEnd; t++) a += S[t].z[j]; return a > 0; });\n      const rowZ = (t, wx) => { const z = S[t].z.slice(); if (wx) { z[1] = wx === 1 ? 1 : 0; z[2] = wx === 2 ? 1 : 0; z[3] = wx === 3 ? 1 : 0; if (wx === 4) { z[1] = 0; z[2] = 0; z[3] = 0; } } return [1].concat(keep.map((j) => z[j])).concat([z[6], z[7], z[8]]); };\n      const XZ = [], yTr = [], isC = [];\n      for (let t = start; t < trainEnd; t++) { XZ.push(rowZ(t)); yTr.push(yObs[t]); isC.push(yTrue[t] > lnCap); }\n      // Step A: regression on known-ahead drivers, trained on RECORDED parks; with the fix, full days are censored (Tobit by EM)\n      let Z = this.ols(XZ, yTr), ys = yTr.slice(), sigA = Z.sigma;\n      const nCens = isC.filter(Boolean).length;\n      if (fixOn && nCens) {\n        let beta = Z.beta.slice();\n        for (let it = 0; it < 80; it++) {\n          let extra = 0;\n          for (let i = 0; i < yTr.length; i++) if (isC[i]) { const mu = XZ[i].reduce((s2, v, j) => s2 + v * beta[j], 0), zz = (lnCap - mu) / sigA, tail = Math.max(1e-12, 1 - this.normCdf(zz)), lam = tail > 1e-10 ? Math.exp(-zz * zz / 2) / Math.sqrt(2 * Math.PI) / tail : zz; ys[i] = mu + sigA * lam; extra += sigA * sigA * (1 + zz * lam - lam * lam); }\n          const nb = Z.solve(ys); let ss = 0; for (let i = 0; i < ys.length; i++) { const e2 = ys[i] - XZ[i].reduce((s2, v, j) => s2 + v * nb[j], 0); ss += e2 * e2; }\n          const ns = Math.sqrt((ss + extra) / ys.length), diff = Math.max(...nb.map((v, j) => Math.abs(v - beta[j]))); beta = nb; sigA = ns; if (diff < 1e-7) break;\n        }\n        Z = { ...Z, beta, V: Z.inv.map((row) => row.map((v) => v * sigA * sigA)) };\n      }\n      const pred = (row) => row.reduce((s2, v, j) => s2 + v * Z.beta[j], 0);\n      // surprise u(t): on training days use the (imputed) training value; afterwards the recorded value\n      const yUse = yObs.slice(); for (let i = 0; i < ys.length; i++) yUse[start + i] = ys[i];\n      const u = yUse.map((v, t) => v - pred(rowZ(t)));\n      const XU = [], yu = [];\n      for (let t = start + 7; t < trainEnd; t++) { XU.push([u[t - 1], u[t - 7]]); yu.push(u[t]); }\n      const A = this.ols(XU, yu), phi1 = A.beta[0], phi7 = A.beta[1];\n      // imputed full days understate the spread, so the new-surprise size is at least what the Tobit spread implies\n      const sE = Math.max(A.sigma, sigA * Math.sqrt(Math.max(0.3, 1 - phi1 * phi1 - phi7 * phi7)));\n      // extra spread from wrong weather forecasts: share of misses × average squared weather effect in training\n      const wCoef = [1, 2, 3].map((j) => { const k = keep.indexOf(j); return k < 0 ? 0 : Z.beta[1 + k]; });\n      let wv = 0, wn = 0; for (let t = start; t < trainEnd; t++) { const wx = S[t].z[1] ? 0 : S[t].z[2] ? 1 : S[t].z[3] ? 2 : -1; const c = wx < 0 ? (wCoef[0] + wCoef[1]) / 2 : wCoef[wx]; wv += c * c; wn++; } wv /= Math.max(1, wn);\n      // psi weights of the AR(1,7) error for multi-step variance\n      const psi = [1]; for (let j = 1; j < 8; j++) psi.push(phi1 * (psi[j - 1] || 0) + (j >= 7 ? phi7 * psi[j - 7] : 0));\n      // weather forecast: right with probability a(h), otherwise flips (clear ↔ the actual weather)\n      const acc = (h) => (P.fcA1 + (P.fcA7 - P.fcA1) * (h - 1) / 6) / 100;\n      const wxOf = (t) => (S[t].z[1] ? 1 : S[t].z[2] ? 2 : S[t].z[3] ? 3 : 4);\n      const wxName = ['', 'rain', 'snow', 'extreme heat', 'clear'];\n      const fcWx = (t, h) => { const rr = this.rng(9000 + t * 17 + h * 101); const a = wxOf(t); if (rr() < acc(h)) return a; return a === 4 ? (S[t].z[6] < -0.3 && rr() < 0.5 ? 2 : 1) : 4; };\n      const fcAt = (t, h) => {\n        const o = t - h, wx = fcWx(t, h), row = rowZ(t, wx);\n        const uh = (s2) => (s2 <= o ? u[s2] : null);\n        const memo = {}; const ub = (s2) => { if (s2 <= o) return u[s2]; if (memo[s2] !== undefined) return memo[s2]; const v = phi1 * ub(s2 - 1) + phi7 * ub(s2 - 7); memo[s2] = v; return v; };\n        const drv = pred(row), carry = ub(t), mu = drv + carry;\n        let vP = 0; for (let i = 0; i < row.length; i++) for (let j = 0; j < row.length; j++) vP += row[i] * row[j] * (Z.V[i][j] || 0);\n        let vE = 0; for (let j = 0; j < h; j++) vE += psi[j] * psi[j];\n        const sd = Math.sqrt(sE * sE * vE + vP + (1 - acc(h)) * wv);\n        const pFull = 1 - this.normCdf((lnCap - mu) / sd);\n        return { t, h, o, wx, row, drv, carry, mu, sd, pFull, f: Math.min(Cap, Math.exp(mu)), lo: Math.min(Cap, Math.exp(mu - 1.645 * sd)), hi: Math.min(Cap, Math.exp(mu + 1.645 * sd)), u1: uh(t - 1), u7: uh(t - 7) };\n      };\n      const thr = P.fcAlert / 100;\n      const evalH = (h) => {\n        let eA = 0, eN = 0, cover = 0, fullN = 0, caught = 0, alerts = 0, good = 0; const pts = [];\n        for (let t = trainEnd; t < Tn; t++) {\n          const a = Math.exp(yObs[t]), F = fcAt(t, h), naive = Math.exp(yObs[t - 7]);\n          eA += Math.abs(F.f - a) / a; eN += Math.abs(naive - a) / a;\n          const covered = a >= F.lo - 1e-9 && a <= F.hi + 1e-9; if (covered) cover++;\n          const isFull = yTrue[t] >= lnCap, al = F.pFull >= thr;\n          if (isFull) fullN++; if (al) alerts++; if (al && isFull) { caught++; good++; }\n          pts.push({ ...F, a, covered, isFull, al });\n        }\n        return { h, mA: eA / test, mN: eN / test, cov: cover / test, fullN, caught, alerts, falseA: alerts - good, pts };\n      };\n      const E = evalH(H), E1 = evalH(1), E3 = evalH(3), E7 = evalH(7);\n      const pts = E.pts;\n      const vmin = Math.min(...pts.map((p2) => Math.min(p2.lo, p2.a))) * 0.95, vmax = Math.max(Cap * 1.03, ...pts.map((p2) => Math.max(p2.hi, p2.a))) * 1.03;\n      const X = (i) => (pts.length > 1 ? (i / (pts.length - 1)) * 600 : 300), Y = (v) => +(190 - ((v - vmin) / (vmax - vmin || 1)) * 175).toFixed(1);\n      const band = pts.map((p2, i) => X(i).toFixed(1) + ',' + Y(p2.hi)).concat(pts.slice().reverse().map((p2, i) => X(pts.length - 1 - i).toFixed(1) + ',' + Y(p2.lo))).join(' ');\n      const fcl = pts.map((p2, i) => X(i).toFixed(1) + ',' + Y(p2.f)).join(' ');\n      const dots = pts.map((p2, i) => ({ x: X(i).toFixed(1), y: Y(p2.a), y2: (Y(p2.a) + 0.01).toFixed(2), col: p2.covered ? '#EEF1F8' : '#FF5A66' }));\n      // ---- one day, step by step ----\n      const di = Math.min(test, Math.max(1, P.fcDay)) - 1, D0 = pts[di], t0 = D0.t, z0 = S[t0].z;\n      const coefOf = (j) => { const k = keep.indexOf(j); return k < 0 ? 0 : Z.beta[1 + k]; };\n      const xm = (v) => '×' + Math.exp(v).toFixed(2);\n      const wxA = wxOf(t0), wxF = D0.wx;\n      const wxCoef = wxF === 4 ? 0 : coefOf(wxF);\n      const seasonPrice = Z.beta[0] + Z.beta[1 + keep.length] * z0[6] + Z.beta[2 + keep.length] * z0[7] + Z.beta[3 + keep.length] * z0[8];\n      const walk = [\n        { k: 'The day', how: 'test day ' + (di + 1) + ' of ' + test + ', forecast made ' + H + ' day' + (H > 1 ? 's' : '') + ' ahead', v: (z0[0] ? 'weekend' : 'weekday') + (z0[4] ? ' · event' : '') + (z0[5] ? ' · surge' : '') },\n        { k: 'Weather: forecast vs what happened', how: 'forecasts ' + H + ' day' + (H > 1 ? 's' : '') + ' ahead are right ' + Math.round(acc(H) * 100) + '% of the time', v: wxName[wxF] + ' vs ' + wxName[wxA] + (wxF === wxA ? ' ✓' : ' ✗') },\n        { k: 'Base level: facility, season and planned price', how: 'exp(intercept + season + price terms)', v: n0(Math.exp(seasonPrice)) + ' cars' },\n        { k: 'Weekend effect', how: 'from the regression (known from the calendar)', v: z0[0] && keep.includes(0) ? xm(coefOf(0)) : '×1.00' },\n        { k: 'Weather effect (forecast weather)', how: wxF === 4 ? 'clear: no effect' : wxName[wxF] + ' effect from the regression', v: xm(wxCoef) },\n        { k: 'Event or surge effect', how: 'scheduled events are known in advance', v: xm((z0[4] ? coefOf(4) : 0) + (z0[5] ? coefOf(5) : 0)) },\n        { k: 'Forecast from the drivers alone', how: 'base level × the effects', v: n0(Math.exp(D0.drv)) + ' cars' },\n        { k: 'Latest known surprise', how: 'on the day the forecast is made (day −' + H + '), demand was ' + (u[D0.o] >= 0 ? 'above' : 'below') + ' what the drivers predicted', v: (u[D0.o] >= 0 ? '+' : '−') + Math.abs((Math.exp(u[D0.o]) - 1) * 100).toFixed(1) + '%' },\n        { k: 'Carry-over to the forecast day', how: 'φ₁ = ' + phi1.toFixed(2) + ' and φ₇ = ' + phi7.toFixed(2) + ', rolled forward ' + H + ' day' + (H > 1 ? 's' : '') + '; it fades the further ahead you forecast', v: xm(D0.carry) },\n        { k: 'Forecast', how: 'drivers × carry-over, never above the ' + n0(Cap) + ' spaces', v: n0(D0.f) + ' cars' },\n        { k: '90% range', how: 'includes the new surprise, its build-up over ' + H + ' day' + (H > 1 ? 's' : '') + ', the chance the weather forecast is wrong and uncertainty in the estimates', v: n0(D0.lo) + '–' + n0(D0.hi) },\n        { k: 'Chance the garage fills', how: 'alert if at least ' + P.fcAlert + '%', v: Math.round(D0.pFull * 100) + '%' + (D0.al ? ' → alert' : '') },\n        { k: 'What was recorded', how: 'plate-read parks (capped at the spaces on full days)', v: n0(D0.a) + ' cars' + (D0.isFull ? ' (full)' : '') + ' · error ' + Math.round(Math.abs(D0.f - D0.a) / D0.a * 100) + '%' }\n      ];\n      const hRow = (Ex) => ({ k: Ex.h + ' day' + (Ex.h > 1 ? 's' : '') + ' ahead', how: 'weather forecast right ' + Math.round(acc(Ex.h) * 100) + '% of the time', vals: [\n        { v: pct(Ex.mA), col: '#7FB0FF' }, { v: pct(Ex.mN), col: '#FF8A93' }, { v: pct(Ex.cov), col: '#D5DAE6' }, { v: Ex.fullN ? Ex.caught + ' of ' + Ex.fullN + (Ex.falseA ? ' · ' + Ex.falseA + ' false' : '') : 'no full days', col: '#5BD6A0' }] });\n      const segs = [{ label: 'Facility · weather and event effects come from Model 0 for this facility', opts: facNames.map((nm, i) => ({ name: nm, pressed: f === i ? 'true' : 'false', bg: f === i ? '#EEF1F8' : 'transparent', fg: f === i ? '#0A0D1A' : '#D5DAE6', bd: f === i ? '#EEF1F8' : 'rgba(255,255,255,0.16)', pick: () => this.setState({ lab: { ...this.state.lab, fcFac: i } }) })) }];\n      L = {\n        kicker: 'MODEL 1 · DEMAND FORECAST WITH DRIVERS', title: 'Can a forecast see a busy day coming, a week ahead?',\n        hasSegs: true, segs,\n        hasCalc: true, calc: { title: 'The numbers behind the forecast', cls: 'qt-row', setupTitle: 'ONE TEST DAY, STEP BY STEP', hasSetup: true, setup: walk, hasDays: false, dayHead: [], dayRows: [], head: ['HOW FAR AHEAD', 'ERROR · THIS MODEL', 'ERROR · SAME DAY LAST WEEK', '90% RANGE COVERAGE', 'FULL DAYS CAUGHT BY ALERTS'], rows: [hRow(E1), hRow(E3), hRow(E7)], note: 'The top block walks through one test day (pick it with the “test day to inspect” slider). The table scores every held-out day at three forecast horizons: errors are against recorded parks, coverage is the share of days inside the 90% range (target 90%), and alerts fire when the chance of filling is at least ' + P.fcAlert + '%. The further ahead, the less is known: yesterday’s surprise has faded and the weather forecast is less reliable. Example inputs only.' },\n        question: 'Reporting shows yesterday. An operator needs to know about a busy day early enough to change prices and staff. This model is trained on the first part of the ' + fname + '’s simulated history, using only what is recorded, and tested on days it has never seen, as if each forecast were made ' + H + ' day' + (H > 1 ? 's' : '') + ' ahead.',\n        hasToggle: true, toggleTitle: 'Full-garage fix (censored training data)', toggleNote: 'Plate reads record at most the number of spaces. With the fix on, full days are treated as “demand was at least this much”, as in Model 0.',\n        toggleText: fixOn ? 'Full-garage fix: on' : 'Full-garage fix: off', togglePressed: fixOn ? 'true' : 'false', toggleBg: fixOn ? '#FF5A66' : 'rgba(255,255,255,0.08)', toggleFg: fixOn ? '#0A0D1A' : '#EEF1F8',\n        toggle: () => this.setState({ lab: { ...this.state.lab, fcFix: this.state.lab.fcFix ? 0 : 1 } }),\n        hasEq: true,\n        eq: 'ln y(t) = β′Z(t) + u(t)        u(t) = φ₁·u(t−1) + φ₇·u(t−7) + ε(t)\\nForecast made h days ahead (on day o = t − h):\\n  ŷ(t) = β̂′Ẑ(t) + û(t),   û rolled forward from the last known surprise u(o)\\n  Ẑ(t): calendar, events and planned price are known; weather is the h-day forecast\\n90% range: exp( ŷ(t) ± 1.645·s_h ),   s_h² = σ̂²·(ψ₀² + … + ψ²_(h−1)) + Ẑ′V̂Ẑ + (1 − a_h)·w̄²\\nAlert if P(demand ≥ C) = 1 − Φ( (ln C − ŷ(t)) / s_h ) ≥ threshold',\n        eqNote: 'y(t) is parks on day t and Z(t) the drivers Model 0 measures (weekend, weather, events, surges, season, price). u(t) is what they don’t explain; φ₁ and φ₇ carry yesterday’s and last week’s surprise forward. A forecast made h days ahead only knows surprises up to day o, so û is rolled forward and fades. ψ are the weights that build up the uncertainty over h days, Ẑ′V̂Ẑ adds the uncertainty in the estimated effects, and (1 − a_h)·w̄² the chance (1 − a_h) that the weather forecast is wrong, times the typical size of a weather effect. Training uses recorded parks; with the fix, full days are censored at the spaces C. Estimated here: φ₁ = ' + phi1.toFixed(2) + ', φ₇ = ' + phi7.toFixed(2) + ', σ̂ = ' + sE.toFixed(3) + '.',\n        inputs: [inp('fcH', 'Forecast made how many days ahead', 1, 7, 1, (v) => v + (v > 1 ? ' days' : ' day')), inp('fcTest', 'Days held out for testing', 14, 120, 1, (v) => v + ' days'),\n          inp('fcA1', 'Weather forecast right, 1 day ahead', 50, 100, 1, (v) => v + '%'), inp('fcA7', 'Weather forecast right, 7 days ahead', 30, 100, 1, (v) => v + '%'),\n          inp('fcAlert', 'Alert when the chance of filling is at least', 10, 90, 5, (v) => v + '%'), inp('fcDay', 'Test day to inspect', 1, test, 1, (v) => 'day ' + Math.min(v, test))],\n        tiles: [\n          { label: 'Forecast error, ' + H + ' day' + (H > 1 ? 's' : '') + ' ahead', value: pct(E.mA), note: 'mean absolute % error on ' + test + ' unseen days · same day last week: ' + pct(E.mN), bd: 'rgba(76,141,255,0.5)' },\n          { label: '90% range coverage', value: pct(E.cov), note: 'share of recorded days inside the range (target 90%)', bd: 'rgba(255,255,255,0.09)' },\n          { label: 'Full days caught by alerts', value: E.fullN ? E.caught + ' of ' + E.fullN : '—', note: E.fullN ? (E.falseA ? E.falseA + ' false alarm' + (E.falseA > 1 ? 's' : '') : 'no false alarms') + ' · alert at ' + P.fcAlert + '% chance of filling' : 'no full days in the test period', bd: 'rgba(91,214,160,0.55)' }\n        ],\n        hasChart: false, hasLine: true,\n        line: { hov: pts.map((p2, i) => ({ x: +(X(i) - 300 / Math.max(1, pts.length - 1)).toFixed(1), w: +(600 / Math.max(1, pts.length - 1)).toFixed(1), tip: 'Test day ' + (i + 1) + ' (' + (S[p2.t].z[0] ? 'weekend' : 'weekday') + (S[p2.t].z[4] ? ', event' : '') + (S[p2.t].z[5] ? ', surge' : '') + '): forecast ' + n0(p2.f) + ' cars, 90% range ' + n0(p2.lo) + '–' + n0(p2.hi) + ', recorded ' + n0(p2.a) + (p2.isFull ? ' (full)' : '') + ' · error ' + Math.round(Math.abs(p2.f - p2.a) / p2.a * 100) + '% · chance of filling ' + Math.round(p2.pFull * 100) + '%' + (p2.al ? ' → alert' : '') + (p2.covered ? '' : ' · outside the range') })), band, fcl, dots, yTop: Math.round(vmax).toLocaleString('en-US'), yBot: Math.round(vmin).toLocaleString('en-US'), title: 'Test period, forecasts made ' + H + ' day' + (H > 1 ? 's' : '') + ' ahead · ' + fname, xMin: 'test day 1', xMax: 'test day ' + test, xLabel: 'PARKS PER DAY · HELD-OUT TEST DAYS', hasZero: true, zeroY: Y(Cap), legend: [{ label: '90% range', sw: 'width: 14px; height: 8px; border-radius: 2px; background: rgba(76,141,255,0.35)' }, { label: 'Forecast', sw: 'width: 14px; height: 2px; background: #4C8DFF' }, { label: 'Recorded', sw: 'width: 8px; height: 8px; border-radius: 50%; background: #EEF1F8' }, { label: 'Outside range', sw: 'width: 8px; height: 8px; border-radius: 50%; background: #FF5A66' }, { label: 'Spaces (' + n0(Cap) + ')', sw: 'width: 14px; height: 0; border-top: 2px dashed rgba(255,255,255,0.6)' }] },\n        insight: 'Forecasting ' + H + ' day' + (H > 1 ? 's' : '') + ' ahead at the ' + fname + ', the model misses by ' + pct(E.mA) + ' on average, against ' + pct(E.mN) + ' for “same day last week”; one day ahead it misses by ' + pct(E1.mA) + ', a week ahead by ' + pct(E7.mA) + '. ' + Math.round(E.cov * 100) + '% of recorded days fell inside the 90% range. ' + (E.fullN ? 'Alerts caught ' + E.caught + ' of the ' + E.fullN + ' full days' + (E.falseA ? ', with ' + E.falseA + ' false alarm' + (E.falseA > 1 ? 's' : '') : '') + '.' : 'There were no full days in the test period.') + (fixOn ? '' : ' With the full-garage fix off, the model learns from capped counts and under-forecasts busy days.'),\n        why: 'Much of the day-to-day swing comes from drivers known in advance (the calendar, weather forecasts, event schedules); the rest has memory. Testing each forecast only with what was known when it was made, at the horizon operators plan on, against a simple baseline, and scoring the surge alerts, is the standard way to show a forecast earns its place.',\n        limits: 'The weather forecast is simulated as right or wrong with a set hit rate; real forecasts are probabilities and can be partly right. Events and prices are assumed known in advance. Demand is daily, not hourly; with real data the full SARIMAX would add hour-of-week patterns. The simulated history is two years for one facility.',\n        data: 'Hourly plate-read counts by facility, with full days treated as censored (Model 0’s fix); archived weather forecasts as they were issued (not actual weather); event calendars, holidays and planned prices. Re-trained regularly and checked against the baseline every month, at 1-, 3- and 7-day horizons.',\n        realAssumed: [\n          { k: 'Real (the logic)', v: 'A forecast can only use what is known when it is made: the further ahead, the less recent information and the less reliable the weather forecast, so error grows with the horizon. That holds for any forecast.' },\n          { k: 'Example inputs', v: 'The demand history is simulated from Model 0’s example effects; the weather-forecast hit rates (' + P.fcA1 + '% and ' + P.fcA7 + '%) and the alert threshold are placeholders, not SPACES data.' },\n          { k: 'Assumed', v: 'Events and prices are known in advance, the weather forecast is either right or wrong, and the effects stay the same over the test period.' }\n        ],\n        guide: {\"sources\": [{\"k\": \"Demand history (here)\", \"v\": \"Simulated from the drivers in Model 0, recorded with the garage’s capacity, so results can be checked\"}, {\"k\": \"Real demand\", \"v\": \"Hourly plate-read counts per facility, with full days censored\"}, {\"k\": \"Weather\", \"v\": \"Archived weather forecasts as issued 1–7 days ahead, from a forecast service\"}, {\"k\": \"Events, holidays, prices\", \"v\": \"Event calendars, the public-holiday calendar and SPACES planned rates\"}, {\"k\": \"Weather-forecast hit rates (sliders)\", \"v\": \"Placeholders. In a real run they come from comparing archived forecasts with what actually happened (forecast verification) for each city, at 1 to 7 days ahead\"}, {\"k\": \"Alert threshold, horizon, test days (sliders)\", \"v\": \"Choices, not data: the alert threshold is agreed with operators (how many false alarms they accept); the horizon is how far ahead they plan; test days is how much history is held back for checking\"}, {\"k\": \"Fixed settings in this simulation\", \"v\": \"The demand history is Model 0’s simulated garage (2 years). When a simulated weather forecast is wrong it flips between clear and the actual weather. These are simplifications for the demo, not SPACES data\"}],\n          \"read\": [\"Left tile: average error at the chosen horizon on days the model never saw, with the “same day last week” baseline in the note.\", \"Middle tile: how honest the range is; near 90% is right, far below means the range is too narrow.\", \"Right tile: how many full days the alerts caught, and how many false alarms.\", \"Walk-through: one test day from drivers to forecast, range and alert, so every step can be checked.\", \"Horizon table: the same scores 1, 3 and 7 days ahead. Plan on the horizon operators actually use.\", \"Chart: forecasts, range and recorded parks across the test days, with the spaces line; red dots fell outside the range.\"],\n          \"pilot\": [\"Back-test on the last 6–12 months for each pilot facility at 1-, 3- and 7-day horizons, using archived weather forecasts.\", \"Run in “shadow mode” for 4–6 weeks: forecasts and alerts produced daily but not shown to operators, then compared with what happened.\", \"If it consistently beats the baseline and the alerts are useful, show forecasts and surge alerts to a few operators in the portal.\", \"Owners: analytics and product. Roughly 6–8 weeks.\"]}\n      };\n    } else if (st.labTab === 'pass') {\n      const money0 = (v) => (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');\n      const n0 = (x) => Math.round(x).toLocaleString('en-US');\n      const n1 = (x) => (Math.round(x * 10) / 10).toFixed(1);\n      const lgam = (x) => { const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7]; if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgam(1 - x); x -= 1; let a = c[0]; const t = x + g + 0.5; for (let i = 1; i < g + 2; i++) a += c[i] / (x + i); return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a); };\n      // ---- effects estimated by Model 0 (full model), for the facility chosen here ----\n      const B = this.regFit().fin.beta;\n      const fac = P.psFac;\n      const facNames = ['Office', 'Hospital', 'Concert venue'];\n      const wRain = Math.exp(B[5]), wSnow = Math.exp(B[6]);\n      const eEv = fac === 2 ? Math.exp(B[8]) : fac === 1 ? Math.exp(B[9]) : 1;\n      const evName = fac === 2 ? 'Concert or game days' : fac === 1 ? 'Emergency-surge days' : 'Event days (no event effect for offices)';\n      const C = P.psC, rho = P.prho, price = P.psR;\n      const redOn = !!P.psRed, Rcap = redOn ? P.psRcap : 0, cR = P.psRedCost, cF = P.psCost;\n      const types = [\n        { name: 'Normal weekdays', how: 'no weather or event effect', d: P.psD1, w: 1, e: 1 },\n        { name: 'Rainy weekdays', how: 'rain ×' + wRain.toFixed(2) + ' on holders and drive-ins', d: P.psD2, w: wRain, e: 1 },\n        { name: 'Snowy weekdays', how: 'snow ×' + wSnow.toFixed(2) + ' on holders and drive-ins', d: P.psD3, w: wSnow, e: 1 },\n        { name: evName, how: fac === 0 ? 'treated like a normal weekday' : 'event ×' + eEv.toFixed(2) + ' on drive-ins only', d: P.psD4, w: 1, e: eEv }\n      ].map((t) => { const pt = Math.min(0.99, P.p * P.psH * t.w); const Traw = P.psT * t.w * t.e, T = Math.min(Math.max(0, C - P.psRes), Traw); return { ...t, pt, T, capped: Traw > T + 0.5, n: Math.max(0, Math.floor(C - T)) };  });\n      const days = types.reduce((s, t) => s + t.d, 0);\n      const active = types.filter((t) => t.d > 0);\n      // tail of X ~ Beta-binomial(k, pt, rr) above n: risk, expected overflow, redirected and refunded holders\n      const stats = (k, pt, n, rr) => {\n        if (k <= n) return { risk: 0, ex: 0, red: 0, ref: 0 };\n        let lp, ratio;\n        if (rr < 1e-4) { lp = k * Math.log(1 - pt); const lr = Math.log(pt / (1 - pt)); ratio = (i) => Math.log((k - i + 1) / i) + lr; }\n        else { const a = pt * (1 - rr) / rr, b = (1 - pt) * (1 - rr) / rr; lp = lgam(a + b) - lgam(a + b + k) + lgam(k + b) - lgam(b); ratio = (i) => Math.log((k - i + 1) / i) + Math.log((i - 1 + a) / (k - i + b)); }\n        let risk = 0, ex = 0, red = 0, ref = 0;\n        for (let i = 1; i <= k; i++) { lp += ratio(i); if (i > n) { const pr = Math.exp(lp), o = i - n; risk += pr; ex += o * pr; red += Math.min(o, Rcap) * pr; ref += Math.max(0, o - Rcap) * pr; } }\n        return { risk: Math.min(1, risk), ex, red, ref };\n      };\n      const month = (k, rr) => {\n        let full = 0, turned = 0, red = 0, ref = 0; const per = [];\n        types.forEach((t) => { const s = t.d > 0 ? stats(k, t.pt, t.n, rr) : { risk: 0, ex: 0, red: 0, ref: 0 }; per.push(s); full += t.d * s.risk; turned += t.d * s.ex; red += t.d * s.red; ref += t.d * s.ref; });\n        const cost = cR * red + cF * ref, rev = k * price;\n        return { k, full, share: days ? full / days : 0, turned, red, ref, cost, rev, prof: rev - cost, per };\n      };\n      const tolP = P.tol / 100;\n      // marginal cost of one more pass when its holder is always turned away beyond the redirect spaces\n      const margCost = types.reduce((s, t) => s + t.d * t.pt, 0) * cF;\n      const noCeil = margCost <= price;\n      const breakCost = price / Math.max(1e-9, types.reduce((s, t) => s + t.d * t.pt, 0));\n      const minN = active.length ? Math.min(...active.map((t) => t.n)) : 0, maxN = active.length ? Math.max(...active.map((t) => t.n)) : 0;\n      const minP = active.length ? Math.min(...active.map((t) => t.pt)) : 0.5;\n      const kMax = Math.min(1500, Math.ceil((maxN + Rcap) / Math.max(minP, 0.05) * 1.8) + 20);\n      let kRho = minN, kInd = minN, kCost = minN, best = -Infinity;\n      const series = [];\n      for (let k = minN; k <= kMax; k++) {\n        const m1 = month(k, rho), m0 = month(k, 0);\n        if (m1.share <= tolP) kRho = k;\n        if (m0.share <= tolP) kInd = k;\n        if (m1.prof > best) { best = m1.prof; kCost = k; }\n        series.push({ k, m1, m0 });\n        if (!noCeil && m1.share > 0.9 && m0.share > 0.9 && k > kCost + 40) break;\n      }\n      const kThird = noCeil ? Math.min(kMax, Math.max(kRho + 1, Math.round(kRho * 1.5))) : kCost;\n      const at = [kRho, kInd, kThird].map((k) => month(k, rho));\n      const atInd = month(kInd, 0);\n      const step = Math.max(1, Math.ceil(series.length / 30));\n      const shown = series.filter((s, i) => i % step === 0);\n      const sdX = (k, pt, rr) => Math.sqrt(k * pt * (1 - pt) * (1 + (k - 1) * rr));\n      const worst = (mm) => { let wi = -1, wr = -1; types.forEach((t, i) => { if (t.d > 0 && mm.per[i].risk > wr) { wr = mm.per[i].risk; wi = i; } }); return wi < 0 ? null : { name: types[wi].name, risk: wr }; };\n      const wLim = worst(at[0]);\n      // ---- tables ----\n      const dayRows = types.map((t, i) => ({ k: t.name, how: t.how, vals: [\n        { v: n0(t.d), col: '#D5DAE6' }, { v: (t.pt * 100).toFixed(0) + '%', col: '#D5DAE6' }, { v: n0(t.T) + (t.capped ? ' (capped)' : ''), col: '#D5DAE6' }, { v: n0(t.n), col: '#FFFFFF' },\n        { v: t.d > 0 ? pct(at[0].per[i].risk) : '—', col: '#7FB0FF' }] }));\n      const colCol = ['#7FB0FF', '#FF8A93', '#5BD6A0'];\n      const row = (k, how, f) => ({ k, how, vals: at.map((c, i) => ({ v: f(c, i), col: colCol[i] })) });\n      const passRows = [\n        row('Passes sold (k)', 'the number tested in this column', (c) => n0(c.k)),\n        row('Average holders at the peak, normal weekday', 'k × p̃ on a normal weekday', (c) => n1(c.k * types[0].pt)),\n        row('Typical daily swing, normal weekday', 'holders move together: √(k·p̃·(1−p̃)·[1 + (k−1)ρ])', (c) => '±' + n1(sdX(c.k, types[0].pt, rho))),\n        ...types.filter((t) => t.d > 0).map((t) => { const i = types.indexOf(t); return row('Chance of a full day · ' + t.name.replace(' (no event effect for offices)', ''), t.n + ' spaces for holders, p̃ = ' + (t.pt * 100).toFixed(0) + '%', (c) => pct(c.per[i].risk)); }),\n        row('Full days per month', 'Σ days × chance of a full day', (c) => n1(c.full)),\n        row('Share of days full', 'full days ÷ ' + days + ' days (limit ' + P.tol + '%)', (c) => pct(c.share)),\n        row('Holders turned away per month', 'Σ days × average overflow', (c) => n1(c.turned)),\n        ...(redOn ? [row('…redirected to the nearby garage', 'up to ' + Rcap + ' a day, at ' + money0(cR) + ' each', (c) => n1(c.red)), row('…refunded', 'beyond ' + Rcap + ' a day, at ' + money0(cF) + ' each', (c) => n1(c.ref))] : []),\n        row('Pass revenue per month', 'k × ' + money0(price), (c) => money0(c.rev)),\n        row('Turned-away cost per month', redOn ? money0(cR) + ' × redirected + ' + money0(cF) + ' × refunded' : money0(cF) + ' × holders turned away', (c) => money0(c.cost)),\n        row('Expected profit per month', 'revenue − turned-away cost', (c) => money0(c.prof))\n      ];\n      const passSetup = [\n        { k: 'Spaces in the garage (C)', how: facNames[fac] + ' garage', v: n0(C) },\n        { k: 'Holder show-up at the peak on a normal weekday (p̃)', how: 'p × h = ' + pct(P.p) + ' × ' + pct(P.psH), v: pct(types[0].pt) },\n        { k: 'Spaces held back for pass holders', how: 'drive-in sales stop when only this many spaces are left, so drive-ins never exceed ' + n0(Math.max(0, C - P.psRes)), v: n0(P.psRes) },\n        { k: 'Days in the month', how: 'normal + rainy + snowy + event days', v: n0(days) },\n        { k: 'Cost of a turned-away holder', how: redOn ? 'redirect ' + money0(cR) + ' for the first ' + Rcap + ' a day, then refund ' + money0(cF) : 'refund and goodwill', v: redOn ? money0(cR) + ' / ' + money0(cF) : money0(cF) },\n        { k: 'Break-even turn-away cost', how: 'pass price ÷ Σ days × p̃: below this, an always-turned-away pass still makes money', v: money0(breakCost) }\n      ];\n      const head3 = noCeil ? 'NO PROFIT CEILING · E.G. ' + n0(kThird) : 'PROFIT-MAXIMISING';\n      const passNote = 'Each column runs the whole month: every day type uses its own show-up rate and its own spaces left after drive-ins, and full days and turned-away holders are added across the month. The first column is the most passes that keep full days within ' + P.tol + '% of the month when holders move together; the second is what the same rule gives if you wrongly assume holders are independent (with holders moving together it actually means ' + pct(at[1].share) + ' of days full). ' + (noCeil ? 'There is no profit-maximising number: one more pass earns ' + money0(price) + ' a month, while even if its holder were always turned away it would cost only ' + money0(margCost) + ' a month' + (redOn ? ' (beyond the redirect spaces)' : '') + '. The third column shows ' + n0(kThird) + ' passes as an example of how full days pile up; only the risk limit stops the overselling.' : 'The third column earns the most; going there from the first adds ' + money0(at[2].prof - at[0].prof) + ' a month of expected profit but ' + n1(at[2].full - at[0].full) + ' more full days a month.') + ' Example inputs only.';\n      const segs = [{ label: 'Facility · weather and event effects come from Model 0 for this facility', opts: facNames.map((nm, i) => ({ name: nm, pressed: fac === i ? 'true' : 'false', bg: fac === i ? '#EEF1F8' : 'transparent', fg: fac === i ? '#0A0D1A' : '#D5DAE6', bd: fac === i ? '#EEF1F8' : 'rgba(255,255,255,0.16)', pick: () => this.setState({ lab: { ...this.state.lab, psFac: i } }) })) }];\n      L = {\n        kicker: 'MODEL 3 · PASSES WITH CORRELATED SHOW-UPS AND SHARED SPACE, OVER A MONTH', title: 'How many monthly passes can a garage sell?',\n        hasSegs: true, segs,\n        hasCalc: true, calc: { title: 'The numbers behind the passes', cls: 'pt-row', hasDays: true, dayTitle: 'THE MONTH · EACH DAY TYPE HAS ITS OWN SHOW-UP AND ITS OWN SPACES', dayHead: ['DAY TYPE', 'DAYS / MONTH', 'HOLDER SHOW-UP p̃', 'DRIVE-INS AT PEAK', 'SPACES FOR HOLDERS', 'FULL-DAY RISK AT ' + n0(kRho) + ' PASSES'], dayRows, head: ['STEP · WHOLE MONTH', 'RISK LIMIT (CORRELATED)', 'RISK LIMIT IF INDEPENDENT', head3], setup: passSetup, hasSetup: true, rows: passRows, note: passNote },\n        realAssumed: [\n          { k: 'Real (the logic)', v: 'When holders move together, a garage can safely sell fewer passes than a simple model says. That is maths.' },\n          { k: 'Example inputs', v: n0(C) + ' spaces, ' + n0(P.psT) + ' drive-ins on a normal weekday, ' + pct(P.p) + ', ' + pct(P.psH) + ', ρ = ' + rho.toFixed(3) + ', ' + n0(P.psRes) + ' spaces held back, a month of ' + P.psD1 + ' normal, ' + P.psD2 + ' rainy, ' + P.psD3 + ' snowy and ' + P.psD4 + ' event days, ' + money0(price) + ' a pass, ' + money0(cF) + ' a refund, ' + money0(cR) + ' a redirect and ' + n0(P.psRcap) + ' spare spaces at the nearby garage are placeholders, not SPACES data.' },\n          { k: 'Assumed', v: 'Within each day type, drive-ins are fixed at their expected level and every holder behaves alike. Weather moves holders and drive-ins by the same Model 0 estimate; events move drive-ins only. In reality drive-ins also vary, and some holders park far more than others.' }\n        ],\n        guide: {\"sources\": [{\"k\": \"Spaces and drive-in peak\", \"v\": \"Occupancy counts from entry and exit times\"}, {\"k\": \"Show-up rate p, peak share h, correlation ρ\", \"v\": \"Each pass holder’s parking days and times from plate reads, by weekday and season\"}, {\"k\": \"Weather and event effects\", \"v\": \"Model 0’s regression on SPACES data, for this facility\"}, {\"k\": \"Mix of days in a month\", \"v\": \"Weather records and the venue or hospital event calendar\"}, {\"k\": \"Pass price\", \"v\": \"SPACES and operator price lists\"}, {\"k\": \"Cost of a full day\", \"v\": \"Refunds, redirects and cancellations after full days; redirect spaces from the nearby garage’s occupancy\"}, {\"k\": \"Spaces held back for pass holders, accepted share of full days (sliders)\", \"v\": \"Operator policy: how many spaces the operator stops selling to drive-ins, and how many full days a month it accepts. Agreed with each operator, not estimated\"}, {\"k\": \"Fixed settings in this simulation\", \"v\": \"Weather and event effects come from Model 0’s example regression; within each day type drive-ins are fixed at their expected level; a month is 21 working days for the pass price. Modelling choices, not SPACES data\"}],\n          \"read\": [\"Left tile: passes allowed by the risk limit across the whole month; its note shows how much an independent-holders model would oversell.\", \"Middle tile: the profit-maximising number, or “No profit ceiling” when a turned-away holder costs less than a pass earns. Then only the risk limit protects customers.\", \"Day-type table: each kind of day has its own holder show-up and its own spaces left after drive-ins. Event days shrink the spaces for holders because drive-ins surge.\", \"Month table: full days and turned-away holders added across the month for three choices, down to profit, so every step can be checked by hand. Chart: hover or tap a bar for its values.\"],\n          \"pilot\": [\"Pick 2–3 garages that sell monthly passes; estimate p, h and ρ from 6 months of plate reads.\", \"Take weather and event effects on drive-ins from Model 0, and the month’s day mix from weather records and the event calendar.\", \"Agree the redirect garage and its spare spaces, then set the pass limit for the next quarter with the operator.\", \"Track full days, redirects, refunds and pass revenue for a quarter against the previous one.\", \"Owners: analytics and the operator. About one quarter.\"]},\n        question: 'Pass holders don’t all park every day, and the ones who do don’t all a + Math.sqrt(q * (b - a) * (m - a)) : b - Math.sqrt((1 - q) * (b - a) * (b - m)); };\n      // ---- Step 1: measured effects from the staggered roll-out study ----\n      const DS = this.didStudy(), meas = !!P.pyMeas;\n      const pc = (x) => Math.exp(x) - 1, sgn = (v) => (v >= 0 ? '+' : '−') + Math.abs(v * 100).toFixed(1) + '%';\n      const sv = (x) => P.pyBaseHrs * (1 - Math.exp(x));           // staff hours saved for a log effect x\n      const hMid = meas ? sv(DS.S.cs) : P.pyHrs, hLo = meas ? sv(DS.S.csCI[1]) : P.pyHrs * (1 - u), hHi = meas ? sv(DS.S.csCI[0]) : P.pyHrs * (1 + u);\n      const upMid = meas ? pc(DS.R.cs) * 100 : P.pyUp, upLo = meas ? pc(DS.R.csCI[0]) * 100 : P.pyUp * (1 - u), upHi = meas ? pc(DS.R.csCI[1]) * 100 : P.pyUp * (1 + u);\n      const leak = meas ? 0 : P.pyLeak;\n      const rmS = Math.pow(1 + P.pySpR / 100, 1 / 12) - 1;\n      // one facility-life path; f* are multipliers on the central estimates, z is an array of monthly demand shocks (or null)\n      const path = (o) => {\n        const Q = o.Q ?? P.pyQ, price = o.price ?? P.pyPrice, tau = o.tau ?? P.pyTau, cost = o.cost ?? P.pyCost, feeMul = o.feeMul ?? 1, hrs = o.hrs ?? hMid, up = o.up ?? upMid;\n        let cum = -(cost - P.pyCapex), pay = cost - P.pyCapex <= 0 ? 0 : null;\n        let sp = cost - P.pySpCost - P.pySales, spPay = sp >= 0 ? 0 : null;\n        const cums = [], det = [];\n        for (let m = 1; m <= term; m++) {\n          const A = o.noRamp ? P.pyAmax / 100 : (P.pyAmax / 100) * (1 - Math.exp(-m / Math.max(tau, 0.1)));\n          const dfac = (1 + (P.pySeas / 100) * Math.sin(2 * Math.PI * (m - 1) / 12)) * (o.z ? Math.exp(0.05 * o.z[m - 1] - 0.00125) : 1);\n          const Qm = Q * dfac, rev = Qm * price;\n          const S = ((o.fL ?? 1) * hrs * P.pyWage + (o.fC ?? 1) * (P.pyCons + P.pyMaint) + (o.fK ?? 1) * (leak / 100) * rev) * A;\n          const U = (o.fU ?? 1) * (up / 100) * rev * A;\n          const F = (P.pyFeeT ? P.pyRate * Qm * A : P.pyFee) * feeMul;\n          let cf = S + U - F;\n          if (m === 1 && !o.noRamp) cf -= (P.pyDown / 30) * Q * price;\n          const dcf = cf / Math.pow(1 + rm, m);\n          cum += dcf;\n          cums.push(cum);\n          if (pay === null && cum >= 0) pay = m;\n          const spc = (F - P.pySup) / Math.pow(1 + rmS, m); sp += spc; if (spPay === null && sp >= 0) spPay = m;\n          if (o.detail) det.push({ m, A, rev, S, U, F, cf, df: 1 / Math.pow(1 + rm, m), dcf, cum, spc, sp });\n        }\n        return { pay, npv: cum, cums, spNpv: sp, spPay, det };\n      };\n      // Monte Carlo with correlated savings / uplift multipliers (Gaussian copula)\n      const r = this.rng(616), N = 2000, pays = [], npvs = [], curves = [], spN = [];\n      const nz = () => Math.sqrt(-2 * Math.log(r() || 1e-12)) * Math.cos(2 * Math.PI * r());\n      for (let i = 0; i < N; i++) {\n        const z1 = nz(), z2 = rho * z1 + Math.sqrt(1 - rho * rho) * nz(), z3 = rho * z1 + Math.sqrt(1 - rho * rho) * nz();\n        const q1 = this.normCdf(z1), hrsI = tri(q1, hLo, hMid, hHi), fC = tri(q1, 1 - u, 1, 1 + u), upI = tri(this.normCdf(z2), upLo, upMid, upHi), fK = tri(this.normCdf(z3), 1 - u, 1, 1 + u);\n        const z = Array.from({ length: term }, () => nz());\n        const res = path({ hrs: hrsI, fC, fK, up: upI, z });\n        pays.push(res.pay === null ? Infinity : res.pay); npvs.push(res.npv); spN.push(res.spNpv);\n        if (i < 400) curves.push(res.cums);\n      }\n      const sp = pays.slice().sort((a, b) => a - b), sn = npvs.slice().sort((a, b) => a - b);\n      const q = (arr, x) => arr[Math.min(arr.length - 1, Math.floor(x * arr.length))];\n      const within = pays.filter((v) => v <= hor).length / N, neverT = pays.filter((v) => v === Infinity).length / N, lossP = npvs.filter((v) => v < 0).length / N;\n      const fm = (v) => (v === Infinity ? 'not within term' : v + ' mo');\n      const naive = path({ noRamp: true });\n      const central = path({ detail: true });\n      // break-even monthly pa ' }\n        ],\n        data: 'Incident logs by type with dates, durations and facilities affected; costs from finance and claims; SLA terms from operator and vendor contracts; insurance terms from the broker.',\n        guide: {\n          sources: [\n            { k: 'Incident counts by type', v: 'Support tickets, monitoring/alerting and status-page history, tagged by type; 12–24 months to start' },\n            { k: 'Cost per incident', v: 'Finance: refunds, repair invoices, staff time, claims paid; legal for data incidents' },\n            { k: 'Live facilities, revenue per hour', v: 'SPACES platform and payment data' },\n            { k: 'Outage length and reach', v: 'Monitoring logs: start, end and which facilities were affected' },\n            { k: 'Share of revenue lost while down', v: 'Payment data during past outages (free exits, unpaid parks) versus normal hours' },\n            { k: 'SLA credits, vendor credits', v: 'Operator contracts; cloud and payment-processor agreements' },\n            { k: 'Deductible, limit, premium', v: 'Insurance policies and broker quotes' },\n            { k: 'Fix cost and effect', v: 'Engineering estimate for the fix (e.g. a backup cloud region): how much shorter outages get and how many network-wide outages it prevents; checked after go-live' },\n            { k: 'Years of SPACES incident history', v: 'How far back SPACES’ own incident logs go (support tickets, monitoring, claims). It sets how much the model trusts SPACES’ own rates' },\n            { k: 'Benchmark evidence (years’ worth)', v: 'Outside data on the same kinds of incident: the insurance broker’s and insurer’s loss data for parking and PARCS operators, cloud and payment providers’ published uptime and status-page histories, and industry reports on parking-equipment failures and damage claims. Expressed as “years’ worth” of evidence, it is the weight given to those benchmarks next to SPACES’ own history (actuaries call this credibility weighting); the broker on', 'Chooses suppliers and order quantities with an optimization model.', 'Choose camera and controller suppliers and reduce single-source risk.', 'Supply chain P1'],\n      ['supply', 'Delayed differentiation', 'Keeps products generic until the last step, then configures them.', 'A standard install kit configured per facility type at the end.', 'Supply chain P2'],\n      ['supply', 'Bullwhip effect', 'Explains how small demand swings amplify upstream.', 'Swings in the sales pipeline can amplify into hardware over- and under-ordering.', 'Supply chain P1'],\n      ['supply', 'Supply chain risk management', 'Classify, identify, assess and mitigate risk.', 'The structure behind this page’s risk map.', 'Risk section'],\n      ['supply', 'Metrics & their pitfalls', 'Designs metrics that drive the right behaviour and can’t be gamed.', 'One clear metric per solution.', 'Outcomes']\n    ];\n    const f = st.courseFilter;\n    const courseTabs = [['all', 'All'], ['econ', 'Econometrics'], ['risk', 'Risk & simulation'], ['supply', 'Supply chains']].map(([id, name]) => { const on = f === id; return { name, selected: on ? 'true' : 'false', bg: on ? '#EEF1F8' : 'transparent', fg: on ? '#0A0D1A' : '#D5DAE6', bd: on ? '#EEF1F8' : 'rgba(255,255,255,0.14)', pick: () => this.setState({ courseFilter: id }) }; });\n    const lab = { risk: ['RISK & SIMULATION', R], supply: ['SUPPLY CHAINS', B], econ: ['ECONOMETRICS', G] };\n    const courseItems = I.filter((x) => f === 'all' || x[0] === f).map((x) => ({ course: lab[x[0]][0], courseCol: lab[x[0]][1], method: x[1], inClass: x[2], spaces: x[3], where: x[4] }));\n    return { courseTabs, courseItems };\n  }\n\n  renderVals() {\n    const P = [\n      {\n        title: 'Demand-based pricing', tag: 'Pricing', short: 'The platform can change a rate at any time. A demand model would tell operators what each rate should be, and when.',\n        solution: 'Elasticity-based pricing', oneLine: 'Measure how demand responds to price at each facility and hour, then set the rate that maximises revenue within capacity.',\n        methods: [0, 1, 4],\n        problem: 'SPACES’ mobile platform makes flexible pricing possible, including daily and multi-entry rates instead of monthly passes. If SPACES already models demand, I’d start by testing and extending it. If not, this is where I’d begin. Too low at peak and the garage fills with money left on the table; too high off-peak and spaces sit empty.',\n        hasEvidence: true, evidence: 'SPACES lets garages offer variable rates by how often people park, so hybrid workers can pay by the day and still come and go multiple times.', source: 'WBGO, April 2022 (Jerry Skillett, SPACES)', srcUrl: 'https://www.wbgo.org/news/2022-04-14/new-technology-makes-garage-parking-more-attractive-for-ny-nj-commuters', hasSrc2: false, source2: '', srcUrl2: '',\n        methodName: 'Panel log-log demand · censored regression · price rule',\n        eq: 'Step 1 · ln Q(f,t) = α_f + τ(t) + β·ln P(f,t) + γ′X(f,t) + ε(f,t)\\nStep 2 · Q(P) = Q̂ · (P / P₀)^β\\nP* = min( P_cap , max( P_floor , P₀ · (Q̂ / θC)^(−1/β) ) )',\n        eqNote: 'Step 1: β is the price elasticity (the % change in parks for a 1% change in price), estimated with facility fixed effects α_f, time effects τ(t) (weekday/weekend and season in Model 0; hour-of-week with real hourly data) and drivers X (weather, events, emergency surges, holidays). Days when the garage is full are treated as censored. Step 2: Q̂ is expected demand at the base price P₀ for the conditions, C the spaces and θ the target occupancy; P* fills θ of the spaces, kept between a floor and a cap. A pure revenue-maximising rule has no interior answer when demand is inelastic (−1 < β < 0), which is why the occupancy target and cap are explicit choices. Model 0 runs both steps.',\n        approach: 'Use past rate changes in SPACES’ data as natural experiments or, where rates rarely change, small controlled price tests. Weather, weekdays, events and emergencies dence: false, evidence: '', source: '', srcUrl: '', hasSrc2: false, source2: '', srcUrl2: '',\n        methodName: 'Regression with AR errors (SARIMAX family) · baseline test',\n        eq: 'ln y(t) = β′Z(t) + u(t)\\nu(t) = φ₁·u(t−1) + φ₇·u(t−7) + ε(t)\\nForecast h days ahead: ŷ(t) = β̂′Ẑ(t) + û(t),   90% range exp( ŷ(t) ± 1.645·s_h )',\n        eqNote: 'Z(t) holds the drivers Model 0 estimates (weekday, season, weather, events, emergency surges, price); for a forecast made h days ahead, Ẑ(t) uses the h-day weather forecast and the scheduled events and prices. u(t) is what the drivers don’t explain; φ₁ and φ₇ carry yesterday’s and last week’s surprise forward, so û(t) is rolled forward from the last known surprise and fades with h. The range s_h widens with h and includes uncertainty in the estimates. Training uses recorded parks with full days censored, as in Model 0. With hourly SPACES data the full SARIMAX adds hour-of-week seasonality and moving-average terms, and the model must beat a “same day last week” baseline on held-out days. Model 1 runs this.',\n        approach: 'Build a forecast per facility type with seasonal time-series models and external regressors, and compare it with a machine-learning benchmark. Validate on months the model never saw, using rolling-origin backtesting. Flag surges when the forecast approaches capacity, and write each alert in plain English with a suggested action.',\n        data: ['Hourly entries per facility', 'Event calendars', 'Weather', 'Holidays', 'Capacity'],\n        tools: ['Python', 'statsmodels', 'scikit-learn', 'SQL'],\n        output: 'A forecasting layer for the operator portal and an alert format operators can act on.',\n        measure: 'Out-of-sample forecast error against a simple seasonal baseline, and how often alerts correctly called a busy day.'\n      },\n      {\n        title: 'Measured ROI across sites', tag: 'Sales economics', short: 'Case studies prove SPACES works at single sites. Prospects need to know what it will do for them.',\n        solution: 'Causal ROI model', oneLine: 'Measure the effect of switching to SPACES across many facilities, then turn it into a payback calculator with confidence ranges.',\n        methods: [0, 2, 7],\n        problem: 'Operators buying parking technology ask three questions: what it costs, what it saves, and when it pays back. Individual case studies are persuasive but don’t generalise to a different hospital, airport or office building.',\n        hasEvidence: true, evidence: 'At Salesforce Tower, entry times fell to under 6 seconds on average and support interactions were only 3–5% of parks in Q3 2024. At Mary Brickell Village, 98% of vehicles entered and exited within 6 seconds.', source: 'SPACES · Salesforce Tower case study, 2024', srcUrl: 'https://www.spacesusa.com/article/salesforce-tower', hasSrc2: true, source2: 'SPACES · Mary Brickell Village case study', srcUrl2: 'https://www.spacesusa.com/article/mary-brickell-village',\n        methodName: 'Staggered difference-in-differences · event study · synthetic control',\n        eq: 'ATT(g, e) = [Ȳ_g(g+e) − Ȳ_g(g−1)] − [Ȳ_not yet switched(g+e) − Ȳ_not yet switched(g−1)]\\nδ = average of ATT(g, e) once the effect has built up',\n        eqNote: 'For each group g of facilities that switched in the same month, ATT(g, e) compares their change in an outcome Ȳ (revenue, throughput, staffing or support cost) from the month before switching to e months later with the change at facilities that had not switched yet. δ is the effect of switching to SPACES. A simple regression Y = α_f + λ_t + δ·SPACES + ε can be biased when facilities switch at different times and the effect builds up or differs between them, so the staggered version (Callaway–Sant’Anna) is used, with an event-study check that the groups moved together before the switch. Model 4 runs both steps.',\n        approach: 'Use SPACES’ roll-out over time as a staggered experiment: facilities that switched earlier are compared with those that switched later. Estimate the effect on each outcome by vertical, use synthetic control where there are only a few comparable sites, and feed the results into a total-cost-of-ownership model against legacy PARCS.',\n        data: ['Pre- & post-install outcomes', 'Install dates', 'Legacy system costs', 'Facility size & vertical'],\n        tools: ['Python', 'R', 'Excel model for sales'],\n        output: 'A vertical-specific payback calculator the sales team can run in a demo, built on measured effects with confidence ranges.',\n        measure: 'Win rate and sales-cycle length for deals that used the calculator, compared with deals that didn’t.'\n      },\n      {\n        title: 'Early signals on renewal risk', tag: 'Retention', short: 'Peer benchmarks would show operators how they compare, and give account teams an early signal well before renewal.',\n        solution: 'Benchmarks + health score', oneLine: 'Compare each facility with similar ones fairly, and predict renewal risk early enough to act.',\n        methods: [0, 5, 6],\n        problem: 'Without context, an operator can’t tell if their garage is doing well. And without a risk signal, account teams find problems too late. Fair peer benchmarks and an early-warning score make the platform more valuable and protect renewals.',\n        hasEvidence: false, evidence: '', source: '', srcUrl: '', hasSrc2: false, source2: '', srcUrl2: '',\n        methodName: 'Regression-adjusted benchmarks · Cox survival',\n        eq: 'Benchmark:  Ŷf = f(size, vertical, location)   gap = Yf − Ŷf\\nRisk:  h(t | x) = h0(t) · exp(β′x)',\n        eqNote: 'The benchmark compares a facility with what similar facilities achieve, not with the network average. The survival model links usage signals x to the hazard h of a facility leaving.',\n        approach: 'Predict each facility’s expected performance from its size, vertical and location, and report the gap as a fair benchmark. Model time-to-churn with survival analysis on signals like falling usage, rising support tickets or unused features, and rank facilities by risk.',\n        data: ['Utilisation', 'Revenue per space', 'Support tickets', 'Feature usage', 'Contract dates'],\n        tools: ['Python', 'lifelines', 'scikit-learn', 'Dashboards'],\n        output: 'A benchmarking view for the operator portal and a monthly at-risk list for account managers, with the reasons behind each score.',\n        measure: 'Renewal rate, and how well the risk score ranked facilities that later left (AUC / concordance).'\n      },\n      {\n        title: 'Support that scales', tag: 'Operations', short: 'Most parkers complete their trip alone. The ones who don’t cost time and money, and that grows with every new site.',\n        solution: 'Drivers of intervention', oneLine: 'Find out exactly what causes a parker to need help, and fix the biggest causes first.',\n        methods: [4, 6],\n        problem: 'Each operator intervention or support call has a cost. As SPACES adds facilities, those costs grow unless the causes are understood and removed.',\n        hasEvidence: true, evidence: 'About 90% of parkers at Salesforce Tower completed their journeys on their own in October 2024, with 2.6–3% needing operator intervention.', source: 'SPACES · Salesforce Tower case study, Oct 2024', srcUrl: 'https://www.spacesusa.com/article/salesforce-tower', hasSrc2: false, source2: '', srcUrl2: '',\n        methodName: 'Logit regression · cost-per-park model',\n        eq: 'Pr(interventioni = 1) = Λ(β0 + β′xi)',\n        eqNote: 'Λ is the logistic function. x includes plate-read confidence, time of day and lighting, first-time vs returning parker, payment set-up, and facility layout.',\n        approach: 'Model every park as succeeded-alone or needed-help, and estimate which factors raise the odds of an intervention. Rank fixes by expected cost saved, and build a support cost-per-park model that shows how costs change as the network grows.',\n        data: ['Park-level outcomes', 'Plate-read confidence', 'Support logs', 'Parker history', 'Facility set-up'],\n        tools: ['Python', 'statsmodels', 'SQL'],\n        output: 'A ranked list of what drives interventions and what fixing each one is worth, plus a support cost model for scaling.',\n        measure: 'Intervention rate and support cost per park, before and after fixes, at the facilities where fixes are made.'\n      },\n      {\n        title: 'Growth with a map', tag: 'Expansion & risk', short: 'Where should SPACES go next, and how would revenue hold up if commuting or travel patterns shifted?',\n        solution: 'Market model + scenarios', oneLine: 'Learn what makes a market succeed from SPACES’ own sites, rank new markets, and stress-test revenue.',\n        methods: [0, 3, 7],\n        problem: 'Expansion decisions are expensive to get wrong, and hybrid work has already changed how people park. Investors and the board will ask how revenue responds to office occupancy, travel and the economy.',\n        hasEvidence: true, evidence: 'SPACES was in more than 100 garages across Manhattan and Brooklyn, with expansion to New Jersey planned.', source: 'WBGO, April 2022 (a 2022 figure)', srcUrl: 'https://www.wbgo.org/news/2022-04-14/new-technology-makes-garage-parking-more-attractive-for-ny-nj-commuters', hasSrc2: false, source2: '', srcUrl2: '',\n        methodName: 'Cross-sectional regression · Monte Carlo scenarios',\n        eq: 'Yf = α + β′Mf + γ·verticalf + εf\\nRevenueT = g(office occupancy, air travel, events, …)',\n        eqNote: 'M holds local market traits (density, transit, office space, income). Fitted on existing sites, the model scores candidate markets. The second model links revenue to macro drivers for scenario testing.',\n        approach: 'Regress facility performance on local market characteristics, then score cities and neighbourhoods SPACES isn’t in yet. Link network revenue to macro drivers, and simulate base, upside and stress scenarios with a response plan for each.',\n        data: ['Facility performance', 'Census & density data', 'Office occupancy', 'Air passenger data', 'Event calendars'],\n        tools: ['Python', 'R', 'SQL', 'Scenario model'],\n        output: 'A ranked list of expansion markets with the reasons behind each score, and a scenario model ready for the board.',\n        measure: 'How closely new sites’ actual ramp-up matches the model’s prediction, and whether stress scenarios are covered by a plan.'\n      }\n    ];\n    const LENS = [\n      'Weather, weekdays, events and emergencies are in the regression before price is measured, so their effects aren’t credited to price (Model 0). Revenue is capped by spaces, so price rules are tested on simulated demand, not average demand (Model 2). Elasticities are reported across data windows, and any live rule ships with price caps and a holdout group.',\n      'Forecasts use the same drivers (weather, calendar, events, emergencies) and carry prediction intervals, and alerts fire on the chance of reaching capacity rather than on a single forecast. Model 3 applies the same logic to monthly passes.',\n      'Payback is reported as a distribution with a tornado chart of the inputs that matter most (Model 4), and measured effects carry confidence intervals.',\n      'Benchmarks carry bootstrap intervals so a small facility isn’t flagged on noise, and facilities are compared on a risk-adjusted basis.',\n      'Support capacity is pooled across facilities (risk pooling), and incident costs are modelled with frequency–severity so reserves cover bad years (Model 6).',\n      'Expansion is set up as a decision tree with a priced pilot (value of information); revenue scenarios use correlated simulation and report downside risk (VaR, CVaR).'\n    ];\n    const MREF = [['Models 0, 2 and 3', 'reg'], ['Model 1', 'fc'], ['Model 4', 'pay'], [null, 'Needs SPACES contract and usage data (survival model); not simulated here.'], ['Models 5 and 6', 'kit'], [null, 'Needs market and facility data; the Monte Carlo approach in Model 4 extends to revenue scenarios.']];\n    P.forEach((p, i) => { p.lens = LENS[i]; const m = MREF[i]; p.hasModel = !!m[0]; p.noModel = !m[0]; p.models = m[0] || ''; p.noModelText = m[0] ? '' : m[1]; p.openModel = () => this.setState({ labTab: m[0] ? m[1] : this.state.labTab }); });\n    const methodCols = ['Panel FE', 'IV / event study', 'DiD / synth', 'Time series', 'Logit / choice', 'Survival', 'ML', 'Simulation'];\n\n    const flipped = this.state.flipped;\n    const problems = P.map((p, i) => ({\n      ...p, n: '0' + (i + 1),\n      methodsText: p.methods.map((m) => methodCols[m]).join(' · '),\n      cls: flipped[i] ? 'on' : '', pressed: flipped[i] ? 'true' : 'false',\n      aria: (flipped[i] ? 'Approach: ' + p.solution : 'Opportunity: ' + p.title) + '. Click to flip.',\n      toggle: () => this.setState({ flipped: { ...this.state.flipped, [i]: !this.state.flipped[i] } })\n    }));\n\n    const sel = this.state.prob;\n    const pickProb = (i) => () => this.setState({ prob: i, tilt: { x: 0, y: 0 } });\n    const ptabs = P.map((p, i) => {\n      const on = i === sel;\n      return { n: '0' + (i + 1), title: p.title, selected: on ? 'true' : 'false', bg: on ? 'rgba(255,90,102,0.14)' : 'transparent', bd: on ? '#FF5A66' : 'rgba(255,255,255,0.10)', fg: on ? '#FFFFFF' : '#AEB6CA', numc: on ? '#FF5A66' : '#8B94AB', pick: pickProb(i) };\n    });\n    const cur = { ...P[sel], n: '0' + (sel + 1) };\n\n    const matrix = P.map((p, i) => {\n      const on = i === sel;\n      return {\n        n: '0' + (i + 1), title: p.title, aria: 'Open opportunity ' + (i + 1) + ': ' + p.title,\n        bg: on ? 'rgba(255,90,102,0.08)' : 'transparent', fg: on ? '#FFFFFF' : '#D5DAE6',\n        cells: methodCols.map((m, j) => {\n          const has = p.methods.indexOf(j) >= 0;\n          return { bg: has ? (on ? '#FF5A66' : '#4C8DFF') : 'transparent', bd: has ? (on ? '#FF5A66' : '#4C8DFF') : 'rgba(255,255,255,0.14)' };\n        }),\n        pick: pickProb(i)\n      };\n    });\n\n    const S = [\n      { title: 'Frame the decision', text: 'Agree the business question and the one metric that defines success, with the team who will use the answer.' },\n      { title: 'Audit the data', text: 'Map what SPACES already records, check its quality, and join in outside data such as events, weather and market data.' },\n      { title: 'Model', text: 'Choose the econometric method that fits the question: causal where we need the why, predictive where we need the what next.' },\n      { title: 'Validate', text: 'Test on data the model hasn’t seen, backtest against current practice, and run controlled pilots at a few facilities: a pilot is a cheap way to buy information before scaling.' },\n      { title: 'Build the tool', text: 'Turn the model into code the team can run: a calculator, a portal feature, a dashboard or a price rule.' },\n      { title: 'Measure & repeat', text: 'Track the metric after launch. What we learn becomes the next question, and the loop starts again.' }\n    ];\n    const N = S.length, step = this.state.step;\n    const active = ((step % N) + N) % N;\n    const steps = S.map((s, i) => {\n      const on = i === active;\n      return { ...s, n: '0' + (i + 1), angle: i * (360 / N), op: on ? 1 : 0.35, bg: on ? '#151C38' : '#0D1326', bd: on ? '#FF5A66' : 'rgba(255,255,255,0.1)' };\n    });\n\n    const outcomes = [\n      { tool: 'Pricing rule & elasticity table', who: 'Operators and product: rates that follow demand', kpi: 'revenue per space, peak occupancy' },\n      { tool: 'Forecasts & surge alerts', who: 'Operators: act before busy days', kpi: 'forecast error, alert hit rate' },\n      { tool: 'ROI / payback calculator', who: 'Sales: a financial case in every demo', kpi: 'win rate, sales-cycle length' },\n      { tool: 'Benchmarks & health score', who: 'Account managers: protect renewals', kpi: 'renewal rate, risk-score accuracy' },\n      { tool: 'Intervention drivers report', who: 'Operations: cut support cost as SPACES scales', kpi: 'intervention rate, cost per park' },\n      { tool: 'Market ranking & scenarios', who: 'Leadership and board: grow with a plan', kpi: 'new-site ramp vs prediction' }\n    ].map((o, i) => ({ ...o, n: '0' + (i + 1), border: i ? '1px solid rgba(255,255,255,0.07)' : 'none' }));\n\n    const on = this.state.surge;\n    const surgeLabel = on\n      ? { text: 'Data layer: on', bg: '#FF5A66', fg: '#0A0D1A', dot: '#0A0D1A', pressed: 'true', note: 'Each record can feed pricing, forecasting, ROI and risk models, built on data the platform already collects.' }\n      : { text: 'Show the data layer', bg: 'rgba(255,255,255,0.08)', fg: '#EEF1F8', dot: '#FF5A66', pressed: 'false', note: 'Plate read in, time in recorded. Plate read out, time out recorded, stay charged automatically to the saved payment method. No ticket, no pay station, no stop to pay.' };\n\n    return {\n      ...this.extraVals(), ...this.labVals(), ...this.courseVals(),\n      problems, ptabs, cur, matrix, methodCols, steps, outcomes, surgeLabel,\n      ringRot: -step * (360 / N), stepLabel: 'Step ' + (active + 1) + ' of ' + N + ' · ' + S[active].title,\n      tilt: this.state.tilt, tiltMove: this.tiltMove, tiltReset: this.tiltReset,\n      prevStep: this.prevStep, nextStep: this.nextStep,\n      setCanvas: this.setCanvas, toggleSurge: this.toggleSurge\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
