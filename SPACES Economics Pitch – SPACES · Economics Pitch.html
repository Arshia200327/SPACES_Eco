<body>
  <div id="__bundler_placeholder">Loading SPACES Economics Pitch...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n.fnode:focus-visible,.cnode:focus-visible,.rdot:focus-visible,.rrow:focus-visible{outline:2px solid #4C8DFF;outline-offset:3px}\n@media (max-width:960px){\n.fly-grid,.risk-grid,.lab-grid{grid-template-columns:minmax(0,1fr)}\n.cond-row{grid-template-columns:repeat(2,minmax(0,1fr))}\n.mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}\n.chain{flex-direction:column}\n.cnode{flex:none}\n.conn{flex:0 0 18px;width:2px;height:auto;background-image:linear-gradient(180deg,rgba(255,255,255,.35) 50%,transparent 50%);background-size:2px 8px;animation:flowv .8s linear infinite}\n.conn.hot{width:3px;height:auto;background-image:linear-gradient(180deg,#FF5A66 50%,transparent 50%)}\n.loopback{display:none}\n}\n@media (max-width:640px){\n.fly-stage{height:330px}\n.fly{transform:scale(.68);transform-origin:top center}\n}\n@media (max-width:960px){\n.hero-grid,.dd-grid{grid-template-columns:minmax(0,1fr)}\n.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}\n.navlinks{display:none}\n.cv{height:420px}\n}\n@media (max-width:640px){\n.wrap{padding:0 16px}\n.g2,.g3,.g4,.dd-split{grid-template-columns:minmax(0,1fr)}\n.cv{height:500px;touch-action:pan-y}\n.slide{padding:80px 0 64px}\n.h1{font-size:40px !important}\n.h2{font-size:30px !important}\n.ring{width:230px}\n}\n@media (prefers-reduced-motion:reduce){.flip-in,.ring,.eq,.lift,.ptab,.rdot,.fnode{transition:none}.spin,.conn,.cnode.hot{animation:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 100%; min-height: 100vh; background: #080C18; color: #EEF1F8; font-family: 'IBM Plex Sans', sans-serif; overflow-x: hidden\" data-canvas-width=\"1440\" data-canvas-height=\"8000\" data-document-role=\"page\" data-label=\"SPACES · Economics Pitch\">\n\n<!-- NAV -->\n<header style=\"position: sticky; top: 0; z-index: 20; background: rgba(8,12,24,0.85); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.07)\">\n<div class=\"wrap\" style=\"display: flex; align-items: center; justify-content: space-between; height: 68px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #EEF1F8\">\n<span style=\"width: 30px; height: 30px; border-radius: 8px; background: #FF5A66; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700; color: #080C18; font-size: 15px\">A<\u002Fspan>\n<span style=\"font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px\">Arshia Goswami <span style=\"color: #8B94AB; font-weight: 400\">for SPACES<\u002Fspan><\u002Fspan>\n<\u002Fa>\n<nav class=\"navlinks\" aria-label=\"Slides\">\n<a href=\"#problems\">Opportunities<\u002Fa>\n<a href=\"#deep\">Deep dive<\u002Fa>\n<a href=\"#lab\">Models<\u002Fa>\n<a href=\"#chain\">Supply chain<\u002Fa>\n<a href=\"#risk\">Risk<\u002Fa>\n<a href=\"#toolkit\">Training<\u002Fa>\n<a href=\"#outcomes\">Outcomes<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- 01 TITLE -->\n<section id=\"top\" style=\"padding: 72px 0 80px\">\n<div class=\"wrap hero-grid\">\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">01 · A pitch to SPACES Operations, LLC<\u002Fdiv>\n<h1 class=\"h1\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 58px; line-height: 1.04; letter-spacing: -0.03em\">Every plate read is a data point. <span style=\"color: #FF5A66\">Let’s make it pay.<\u002Fspan><\u002Fh1>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #AEB6CA; max-width: 480px\">SPACES has already made parking ticketless. The next step is economic: using the data the platform records to set prices, forecast demand, prove ROI and grow with confidence. I bring the econometrics, regression and code to do it.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"#problems\" style=\"background: #FF5A66; color: #080C18; text-decoration: none; font-weight: 600; font-size: 15px; padding: 14px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">See the six opportunities<\u002Fa>\n<a href=\"#deep\" style=\"color: #EEF1F8; text-decoration: none; font-weight: 500; font-size: 15px; padding: 14px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">How I’d solve them<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.08)\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600\">Arshia Goswami<\u002Fdiv>\n<div style=\"font-size: 14px; color: #8B94AB\">MS Quantitative Economics · Econometrics · Regression · Coding<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: relative; border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; overflow: hidden\">\n<div style=\"position: absolute; top: 20px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; z-index: 2; pointer-events: none\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8B94AB\">Drive in. Drive out.<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 500\">Every park becomes data.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B94AB; text-align: right\">Drag to rotate<\u002Fdiv>\n<\u002Fdiv>\n<canvas class=\"cv\" ref=\"{{ setCanvas }}\" aria-label=\"3D animation of one parking session: the plate is read at the entry gate and the time in is recorded, the car parks, then the car drives through the exit: the plate is read again, the time out is recorded, the stay is charged automatically to the saved payment method and the barrier lifts\"><\u002Fcanvas>\n<div style=\"position: absolute; left: 22px; right: 22px; bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; z-index: 2\">\n<button class=\"pill\" sc-camel-on-click=\"{{ toggleSurge }}\" aria-pressed=\"{{ surgeLabel.pressed }}\" style=\"background: {{ surgeLabel.bg }}; color: {{ surgeLabel.fg }}\">\n<span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{ surgeLabel.dot }}\"><\u002Fspan>{{ surgeLabel.text }}<\u002Fbutton>\n<div style=\"font-size: 13px; color: #AEB6CA; max-width: 300px; line-height: 1.45\">{{ surgeLabel.note }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 SPACES TODAY -->\n<section id=\"today\" class=\"slide\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 44px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">02 · SPACES today<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">“A movement in parking” that already works.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">SPACES replaces tickets, gate hardware and pay stations with integrated license-plate recognition and mobile payment. Drivers drive in and drive out. Operators in real estate, airports and hospitals get lower installation and consumable costs, custom reporting and 24/7 support, at a fraction of the cost of a traditional PARCS system.<\u002Fp>\n<div class=\"about\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><span>SPACES’ own description of its product and customers: <a href=\"https://www.spacesusa.com\" target=\"_blank\" rel=\"noopener\">spacesusa.com<\u002Fa>. These are SPACES’ claims, not independent measurements.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.1); background: #0D1326; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline\"><div style=\"font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 600\">How to read the numbers on this site<\u002Fdiv><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8B94AB\">EVERY NUMBER AND CHART CARRIES ONE OF THESE LABELS<\u002Fdiv><\u002Fdiv>\n<div class=\"keygrid\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"bdg b-src\" style=\"align-self: flex-start\">SOURCED<\u002Fspan><span style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\">Published by SPACES or the press. Linked, with its date.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"bdg b-calc\" style=\"align-self: flex-start\">CALCULATED · EXAMPLE INPUTS<\u002Fspan><span style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\">Computed live in your browser from example inputs you can change. Not SPACES data and not a forecast of SPACES’ results.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"bdg b-ill\" style=\"align-self: flex-start\">ILLUSTRATION<\u002Fspan><span style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\">Fictional values used to show how something works, such as the plate and times in the animation.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"bdg b-jdg\" style=\"align-self: flex-start\">JUDGEMENT<\u002Fspan><span style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\">My assessment from public information. Each one names the model that would replace it with a measured estimate.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"bdg b-con\" style=\"align-self: flex-start\">CONCEPT<\u002Fspan><span style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\">A diagram of how things connect. No numbers.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"g4\">\n<div class=\"lift\" style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: #FF5A66\">&lt;6 s<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5\">average entry time<\u002Fdiv>\n<div style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\"><b style=\"color: #EEF1F8; font-weight: 600\">Why it matters · <\u002Fb>Fast, ticketless entry is the product promise, and every read leaves the timestamp the models on this site use.<\u002Fdiv><div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.12)\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><a href=\"https://www.spacesusa.com/article/salesforce-tower\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; color: #7FB0FF\">SPACES · Salesforce Tower case study, 2024<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"lift\" style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: #FF5A66\">98%<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5\">of vehicles enter and exit within 6 seconds<\u002Fdiv>\n<div style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\"><b style=\"color: #EEF1F8; font-weight: 600\">Why it matters · <\u002Fb>Reads this reliable mean the entry and exit records are complete enough to build pricing and forecasts on.<\u002Fdiv><div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.12)\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><a href=\"https://www.spacesusa.com/article/mary-brickell-village\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; color: #7FB0FF\">SPACES · Mary Brickell Village case study (undated)<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"lift\" style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: #4C8DFF\">3–5%<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5\">of parks needed a support interaction, Q3 2024<\u002Fdiv>\n<div style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\"><b style=\"color: #EEF1F8; font-weight: 600\">Why it matters · <\u002Fb>Support is the cost that grows with every new site; Opportunity 05 and Models 5–6 are about keeping it down.<\u002Fdiv><div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.12)\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><a href=\"https://www.spacesusa.com/article/salesforce-tower\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; color: #7FB0FF\">SPACES · Salesforce Tower case study, Q3 2024 (one site)<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"lift\" style=\"border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'Sora', sans-serif; font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: #4C8DFF\">100+<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5\">garages in Manhattan and Brooklyn, with New Jersey next<\u002Fdiv>\n<div style=\"font-size: 13px; line-height: 1.5; color: #AEB6CA\"><b style=\"color: #EEF1F8; font-weight: 600\">Why it matters · <\u002Fb>The size of the network the data comes from. This is a 2022 figure; I have not found a more recent published count.<\u002Fdiv><div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.12)\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><a href=\"https://www.wbgo.org/news/2022-04-14/new-technology-makes-garage-parking-more-attractive-for-ny-nj-commuters\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; color: #7FB0FF\">WBGO, April 2022<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"g2\">\n<div style=\"border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #4C8DFF\"><\u002Fspan><span style=\"font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600\">What the platform already records<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #AEB6CA\">Because every park starts and ends with a plate read and a mobile payment, SPACES holds a clean, timestamped record of parking behaviour.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<span class=\"chip\">Entry &amp; exit time<\u002Fspan><span class=\"chip\">Dwell time<\u002Fspan><span class=\"chip\">Rate paid<\u002Fspan><span class=\"chip\">Validations<\u002Fspan><span class=\"chip\">Repeat visits by plate<\u002Fspan><span class=\"chip\">Facility &amp; vertical<\u002Fspan><span class=\"chip\">Support interventions<\u002Fspan>\n<\u002Fdiv>\n<div class=\"about\"><span class=\"bdg b-jdg\">JUDGEMENT<\u002Fspan><span>Inferred from how the product works publicly; which fields SPACES stores, and how cleanly, is the first thing a data audit would confirm.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 24px; border: 1px solid rgba(255,90,102,0.35); background: #160F1C; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #FF5A66\"><\u002Fspan><span style=\"font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600\">Questions that data could answer<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column\">\n<div style=\"padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 15px\">What should each rate be, and when should it change?<\u002Fdiv>\n<div style=\"padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 15px\">How busy will next week be?<\u002Fdiv>\n<div style=\"padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 15px\">What will SPACES save this operator, with what confidence?<\u002Fdiv>\n<div style=\"padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 15px\">Which facilities are at risk, and why?<\u002Fdiv>\n<div style=\"padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 15px\">Where should SPACES grow next?<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 PROBLEMS OVERVIEW -->\n<section id=\"problems\" class=\"slide\" style=\"background: #0B1022\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 44px\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">03 · Six opportunities<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">Where better economics changes the outcome.<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #AEB6CA\">Drawn from public information only. Some of this may already exist inside SPACES; my first step would be to learn what you have and build on it.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; color: #8B94AB; max-width: 300px; line-height: 1.55\">Click a card to turn it over and see how I would solve it.<\u002Fp>\n<\u002Fdiv>\n<div class=\"g3\">\n<sc-for list=\"{{ problems }}\" as=\"p\" hint-placeholder-count=\"6\">\n<button class=\"flip {{ p.cls }}\" sc-camel-on-click=\"{{ p.toggle }}\" aria-pressed=\"{{ p.pressed }}\" aria-label=\"{{ p.aria }}\">\n<span class=\"flip-in\">\n<span class=\"face\" style=\"background: #0F1630; border: 1px solid rgba(255,255,255,0.09)\">\n<span style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #FF5A66\">OPPORTUNITY {{ p.n }}<\u002Fspan>\n<span style=\"width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center\">\n<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EEF1F8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-3-6.7\"><\u002Fpath><path d=\"M21 4v5h-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fspan>\n<span style=\"font-family: 'Sora', sans-serif; font-size: 23px; font-weight: 600; line-height: 1.2; color: #EEF1F8\">{{ p.title }}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #AEB6CA\">{{ p.short }}<\u002Fspan>\n<span style=\"margin-top: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B94AB\">{{ p.tag }}<\u002Fspan>\n<\u002Fspan>\n<span class=\"face back\" style=\"background: #F3F1EC; color: #121626\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #1F5FD6\">MY APPROACH<\u002Fspan>\n<span style=\"font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 600; line-height: 1.2\">{{ p.solution }}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: #3A4056\">{{ p.oneLine }}<\u002Fspan>\n<span style=\"margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(18,22,38,0.14); font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #C8303D\">{{ p.methodsText }}<\u002Fspan>\n<\u002Fspan>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 DEEP DIVE -->\n<section id=\"deep\" class=\"slide\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 44px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">04 · Opportunity by opportunity<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">The opportunity, the model, the data, the result.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">Pick an opportunity. Each one shows the econometric method I would use, the model behind it, the SPACES data it runs on, the code, and how SPACES would know it worked.<\u002Fp>\n<\u002Fdiv>\n<div class=\"dd-grid\">\n<div role=\"tablist\" aria-label=\"Opportunities\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{ ptabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n<button class=\"ptab\" role=\"tab\" aria-selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.pick }}\" style=\"background: {{ t.bg }}; border-color: {{ t.bd }}\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{ t.numc }}; min-width: 22px\">{{ t.n }}<\u002Fspan>\n<span style=\"font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 500; color: {{ t.fg }}\">{{ t.title }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #FF5A66\">OPPORTUNITY {{ cur.n }} · {{ cur.tag }}<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 32px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15\">{{ cur.title }}<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.65; color: #AEB6CA\">{{ cur.problem }}<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ cur.hasEvidence }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-radius: 16px; border: 1px solid rgba(76,141,255,0.35); background: rgba(76,141,255,0.07); padding: 16px 20px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7FB0FF\">WHAT SPACES HAS PUBLISHED<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #D5DAE6\">{{ cur.evidence }}<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\"><span class=\"bdg b-src\">SOURCED<\u002Fspan><a href=\"{{ cur.srcUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; color: #7FB0FF\">{{ cur.source }}<\u002Fa><sc-if value=\"{{ cur.hasSrc2 }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ cur.srcUrl2 }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; color: #7FB0FF\">{{ cur.source2 }}<\u002Fa><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div class=\"eq-stage\">\n<div class=\"eq\" sc-camel-on-mouse-move=\"{{ tiltMove }}\" sc-camel-on-mouse-leave=\"{{ tiltReset }}\" style=\"transform: rotateX({{ tilt.x }}deg) rotateY({{ tilt.y }}deg); border-radius: 22px; border: 1px solid rgba(255,90,102,0.4); background: #120E1E; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px rgba(0,0,0,0.35)\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF8A93\">THE MODEL<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B94AB\">{{ cur.methodName }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 19px; line-height: 1.6; color: #FFFFFF; white-space: pre-line; overflow-wrap: anywhere\">{{ cur.eq }}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.6; color: #AEB6CA\">{{ cur.eqNote }}<\u002Fdiv>\n<div class=\"about\"><span class=\"bdg b-con\">METHOD · NO NUMBERS<\u002Fspan><span>The symbols are filled in from SPACES’ own data during a pilot. The working models in section 05 show an example run with example inputs.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ cur.hasModel }}\" hint-placeholder-val=\"{{ true }}\">\n<a href=\"#lab\" sc-camel-on-click=\"{{ cur.openModel }}\" style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 14px; border: 1px solid rgba(127,176,255,0.45); background: rgba(76,141,255,0.08); padding: 14px 18px; text-decoration: none; color: #EEF1F8; min-height: 44px; box-sizing: border-box\"><span><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7FB0FF\">WORKING MODEL ON THIS PAGE · <\u002Fspan><span style=\"font-weight: 600\">{{ cur.models }}<\u002Fspan><\u002Fspan><span style=\"color: #7FB0FF\">Open →<\u002Fspan><\u002Fa>\n<\u002Fsc-if>\n<sc-if value=\"{{ cur.noModel }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-radius: 14px; border: 1px dashed rgba(255,255,255,0.2); padding: 14px 18px; font-size: 14px; line-height: 1.55; color: #AEB6CA\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8B94AB\">NO WORKING MODEL YET · <\u002Fspan>{{ cur.noModelText }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8B94AB\">HOW I’D SOLVE IT<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.7; color: #D5DAE6\">{{ cur.approach }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 16px; border: 1px solid rgba(91,214,160,0.4); background: rgba(91,214,160,0.06); padding: 16px 20px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #5BD6A0\">RISK LENS<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #D5DAE6\">{{ cur.lens }}<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dd-split\">\n<div style=\"border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8B94AB\">DATA IT RUNS ON<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ cur.data }}\" as=\"d\" hint-placeholder-count=\"4\"><span class=\"chip\">{{ d }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8B94AB\">CODE &amp; TOOLS<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ cur.tools }}\" as=\"d\" hint-placeholder-count=\"4\"><span class=\"chip\" style=\"border-color: rgba(76,141,255,0.4); color: #BFD5FF\">{{ d }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dd-split\">\n<div style=\"border-radius: 16px; background: #F3F1EC; color: #121626; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #1F5FD6\">WHAT SPACES GETS<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6\">{{ cur.output }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 16px; background: #F3F1EC; color: #121626; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #C8303D\">HOW WE’D KNOW IT WORKED<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6\">{{ cur.measure }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 LAB -->\n<section id=\"lab\" class=\"slide\" style=\"background: #0B1022\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 800px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">05 · Try the models<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">Seven working models. Your numbers, not mine.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">Each model runs live in your browser. It starts with a regression that separates price from the other things that move parking demand (weekdays, weather, events, emergencies), so no number is given before those factors are accounted for. Change any input; every result is calculated from what you enter.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-radius: 14px; border: 1px solid rgba(255,180,90,0.45); background: rgba(255,180,90,0.08); padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFB45A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 8v5\"><\u002Fpath><path d=\"M12 16h.01\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-size: 14px; line-height: 1.6; color: #F3E3CC\"><span style=\"font-weight: 600\">Example inputs only.<\u002Fspan> None of the starting values are SPACES data or estimates of SPACES’ business. The regression runs on simulated data built from effects you can set, so you can check that it recovers them. Simulations use a fixed random seed, so the same inputs always give the same answer.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8B94AB\">MODEL MAP · EACH MODEL AND THE OPPORTUNITY IT SERVES<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Models\" class=\"mapgrid\">\n<sc-for list=\"{{ labTabs }}\" as=\"t\" hint-placeholder-count=\"7\">\n<button class=\"mapcard\" role=\"tab\" aria-selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.pick }}\" style=\"background: {{ t.bg }}; color: {{ t.fg }}; border-color: {{ t.bd }}\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; opacity: 0.8\">{{ t.num }}<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 600; line-height: 1.3\">{{ t.name }}<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{ t.sub }}\">{{ t.opp }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ lab.usesConditions }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-radius: 18px; border: 1px solid rgba(127,176,255,0.35); background: rgba(76,141,255,0.06); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7FB0FF\">DAY CONDITIONS · APPLIED BEFORE ANY NUMBER IS GIVEN<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 600\">Demand ×{{ cond.multText }}<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cond-row\">\n<sc-for list=\"{{ condGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 12px; color: #8B94AB\">{{ g.label }}<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{ g.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n<button class=\"seg\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"background: {{ o.bg }}; color: {{ o.fg }}; border-color: {{ o.bd }}\">{{ o.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #D5DAE6\">{{ cond.summary }}<\u002Fdiv>\n<div class=\"about\"><span class=\"bdg b-calc\">CALCULATED · EXAMPLE INPUTS<\u002Fspan><span><b>Where it comes from · <\u002Fb>the effects estimated by the Model 0 regression on simulated data. <b>Why it matters · <\u002Fb>every model below starts from this multiplier, so no number ignores the weekday, weather or events.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div class=\"lab-grid\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF8A93\">{{ lab.kicker }}<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.2\">{{ lab.title }}<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #AEB6CA\">{{ lab.question }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ lab.hasSegs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-radius: 16px; border: 1px solid rgba(127,176,255,0.35); background: rgba(76,141,255,0.06); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{ lab.segs }}\" as=\"g\" hint-placeholder-count=\"1\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"font-size: 12px; color: #8B94AB\">{{ g.label }}<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{ g.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"seg\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"background: {{ o.bg }}; color: {{ o.fg }}; border-color: {{ o.bd }}\">{{ o.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ lab.hasToggle }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); background: #0D1326; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 340px\">\n<div style=\"font-size: 14px; font-weight: 600; color: #EEF1F8\">{{ lab.toggleTitle }}<\u002Fdiv>\n<div style=\"font-size: 12px; line-he <\u002Fdiv>\n<sc-for list=\"{{ lab.guide.pilot }}\" as=\"g\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; gap: 10px; font-size: 13px; line-height: 1.55; color: #D5DAE6\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 50%; background: rgba(91,214,160,0.16); color: #5BD6A0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; display: inline-flex; align-items: center; justify-content: center\">{{ g.n }}<\u002Fspan><span>{{ g.t }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 FLYWHEEL -->\n<section id=\"loop\" class=\"slide\" style=\"background: #0B1022\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">06 · The data flywheel<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">Each facility makes the next one easier to win.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">This is the loop the six opportunities feed. More sites mean more data, better models, better results for operators and a stronger case for the next sale. This loop runs on data SPACES already collects.<\u002Fp>\n<div class=\"about\" style=\"max-width: 720px\"><span class=\"bdg b-con\">CONCEPT<\u002Fspan><span>How the six opportunities reinforce each other. No numbers are claimed here; each stage’s measure is named in its card.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<button class=\"pill\" sc-camel-on-click=\"{{ toggleFly }}\" style=\"background: rgba(255,255,255,0.08); color: #EEF1F8\">\n<sc-if value=\"{{ flyIsPaused }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"#EEF1F8\" aria-hidden=\"true\"><path d=\"M7 5l12 7-12 7z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{ flyIsPlaying }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EEF1F8\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M8 5v14M16 5v14\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>{{ flyBtn }}<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"fly-grid\">\n<div class=\"fly-stage\">\n<div class=\"fly\">\n<svg class=\"spin\" width=\"480\" height=\"480\" sc-camel-view-box=\"0 0 480 480\" aria-hidden=\"true\" style=\"position: absolute; inset: 0\"><circle cx=\"240\" cy=\"240\" r=\"190\" fill=\"none\" stroke=\"rgba(255,90,102,0.45)\" stroke-width=\"1.5\" stroke-dasharray=\"4 10\"><\u002Fcircle><circle cx=\"240\" cy=\"50\" r=\"5\" fill=\"#FF5A66\"><\u002Fcircle><\u002Fsvg>\n<svg width=\"480\" height=\"480\" sc-camel-view-box=\"0 0 480 480\" aria-hidden=\"true\" style=\"position: absolute; inset: 0\"><circle cx=\"240\" cy=\"240\" r=\"150\" fill=\"none\" stroke=\"rgba(255,255,255,0.06)\" stroke-width=\"1\"><\u002Fcircle><\u002Fsvg>\n<div style=\"position: absolute; left: 140px; top: 165px; width: 200px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF8A93\">STAGE {{ flyCur.n }} OF 5<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.25\">{{ flyCur.title }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ flyNodes }}\" as=\"f\" hint-placeholder-count=\"5\">\n<button class=\"fnode\" sc-camel-on-click=\"{{ f.pick }}\" aria-pressed=\"{{ f.pressed }}\" style=\"left: {{ f.x }}px; top: {{ f.y }}px; background: {{ f.bg }}; border-color: {{ f.bd }}; color: {{ f.fg }}\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{ f.numc }}\">0{{ f.n }}<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 600; line-height: 1.3\">{{ f.title }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"border-radius: 22px; border: 1px solid rgba(255,90,102,0.35); background: #120E1E; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF8A93\">STAGE {{ flyCur.n }}<\u002Fdiv>\n<div style=\"font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.2\">{{ flyCur.title }}<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.65; color: #AEB6CA\">{{ flyCur.text }}<\u002Fdiv>\n<div style=\"padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7FB0FF\">MY LEVER HERE<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.6; color: #D5DAE6\">{{ flyCur.lever }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 6px\" aria-hidden=\"true\">\n<sc-for list=\"{{ flyNodes }}\" as=\"f\" hint-placeholder-count=\"5\"><span style=\"flex: 1; height: 4px; border-radius: 4px; background: {{ f.bar }}; transition: background .4s\"><\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 SUPPLY & VALUE CHAIN -->\n<section id=\"chain\" class=\"slide\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF5A66\">07 · Supply &amp; value chain<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em\">Follow a shock down the chain.<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #AEB6CA\">Two chains run SPACES: the physical chain that gets a garage live, and the money-and-data chain that runs every day after. Pick a shock to watch where it travels, or click any link to see what I would measure there.<\u002Fp>\n<div class=\"about\"><span class=\"bdg b-con\">CONCEPT<\u002Fspan><span><b>Where it comes from · <\u002Fb>SPACES’ public description of its product and install process. The shock paths show which links a shock would reach, in order; they are not measured sizes or delays. <b>Why it matters · <\u002Fb>each link names what I would measure there, so a shock’s real cost can be estimated from SPACES’ data.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B94AB; margin-right: 6px\">SIMULATE A SHOCK<\u002Fspan>\n<sc-for list=\"{{ shockTabs }}\" as=\"s\" hint-placeholder-count=\"4\">\n<button class=\"tab\" sc-camel-on-click=\"{{ s.pick }}\" aria-pressed=\"{{ s.pressed }}\" style=\"background: {{ s.bg }}; color: {{ s.fg }}; border-color: {{ s.bd }}\">{{ s.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"border-radius: 26px; border: 1px solid rgba(255,255,255,0.08); background: #0D1326; padding: 30px; display: flex; flex-direction: column; gap: 30px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #4C8DFF\"><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #AEB6CA\">PHYSICAL CHAIN · GETTING A GARAGE LIVE<\u002Fspan><\u002Fdiv>\n<div class=\"chain\">\n<sc-for list=\"{{ chainA }}\" as=\"c\" hint-placeholder-count=\"4\">\n<button class=\"cnode {{ c.cls }}\" sc-camel-on-click=\"{{ c.pick }}\" aria-pressed=\"{{ c.pressed }}\" style=\"background: {{ c.bg }}; border-color: {{ c.bd }}\">\n<span style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7FB0FF\">{{ c.code }}<\u002Fspan>\n<sc-if value=\"{{ c.hit }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #FF5A66; color: #0A0D1A\">HIT {{ c.order }}<\u002Fspan><\u002Fsc-if>\n<\u002Fspan>\n<span style=\"font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; color: #EEF1F8; line-height: 1.25\">{{ c.title }}<\u002Fspan>\n<span style=\"font-size: 12px; color: #8B94AB; line-height: 1.4\">{{ c.sub }}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ c.notLast }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"conn {{ c.connCls }}\"><\u002Fspan><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #FF5A66\"><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #AEB6CA\">MONEY &amp; DATA CHAIN · EVERY PARK, EVERY DAY<\u002Fspan><\u002Fdiv>\n<div class=\"chain\">\n<sc-for list=\"{{ chainB }}\" as=\"c\" hint-placeholder-count=\"6\">\n<button class=\"cnode {{ c.cls }}\" sc-camel-on-click=\"{{ c.pick }}\" aria-pressed=\"{{ c.pressed }}\" style=\"background: {{ c.bg }}; border-color: {{ c.bd }}\">\n<span style=\"display: flex; justify-content:
